<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"
     aria-label="A cycle of three parts: a goal, the action you take, and the reward. The reward feeds a new goal, and the cycle repeats. Beside it, the same cycle with the reward removed, which stops after one turn.">
  <title>The core loop: goal, action, reward — and what happens without the reward</title>

  <defs>
    <marker id="cl-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ddc84"/>
    </marker>
    <marker id="cl-dead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f7893"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Roboto, Arial, sans-serif">

    <!-- ===== the loop that turns ===== -->
    <text x="196" y="30" text-anchor="middle" fill="#3ddc84" font-size="12.5" font-weight="700" letter-spacing="1.3">IT KEEPS GOING</text>

    <circle cx="196" cy="160" r="86" fill="none" stroke="#1f4a38" stroke-width="1.5" stroke-dasharray="4 5"/>

    <g>
      <rect x="126" y="52" width="140" height="46" rx="10" fill="#0f2e22" stroke="#3ddc84" stroke-width="1.5"/>
      <text x="196" y="72" text-anchor="middle" fill="#3ddc84" font-size="12" font-weight="700" letter-spacing="1.1">GOAL</text>
      <text x="196" y="89" text-anchor="middle" fill="#eaf1f8" font-size="13">“get that coin”</text>
    </g>
    <g>
      <rect x="236" y="196" width="140" height="46" rx="10" fill="#0d2440" stroke="#3e8fd6" stroke-width="1.5"/>
      <text x="306" y="216" text-anchor="middle" fill="#3e8fd6" font-size="12" font-weight="700" letter-spacing="1.1">ACTION</text>
      <text x="306" y="233" text-anchor="middle" fill="#eaf1f8" font-size="13">jump for it</text>
    </g>
    <g>
      <rect x="16" y="196" width="140" height="46" rx="10" fill="#2e2410" stroke="#f5b02e" stroke-width="1.5"/>
      <text x="86" y="216" text-anchor="middle" fill="#f5b02e" font-size="12" font-weight="700" letter-spacing="1.1">REWARD</text>
      <text x="86" y="233" text-anchor="middle" fill="#eaf1f8" font-size="13">ping! +1</text>
    </g>

    <g stroke="#3ddc84" stroke-width="2" fill="none" marker-end="url(#cl-a)">
      <path d="M258 98 Q296 122 306 190"/>
      <path d="M240 232 L164 232"/>
      <path d="M86 190 Q76 122 134 98"/>
    </g>
    <text x="196" y="166" text-anchor="middle" fill="#c9f5dc" font-size="12.5">the reward makes</text>
    <text x="196" y="183" text-anchor="middle" fill="#c9f5dc" font-size="12.5">you want the next goal</text>

    <!-- ===== the loop that stops ===== -->
    <text x="536" y="30" text-anchor="middle" fill="#8b9db1" font-size="12.5" font-weight="700" letter-spacing="1.3">TAKE THE REWARD AWAY</text>

    <g opacity="0.85">
      <rect x="466" y="52" width="140" height="46" rx="10" fill="#12304f" stroke="#5f7893" stroke-width="1.5"/>
      <text x="536" y="72" text-anchor="middle" fill="#8b9db1" font-size="12" font-weight="700" letter-spacing="1.1">GOAL</text>
      <text x="536" y="89" text-anchor="middle" fill="#c3d3e6" font-size="13">“get that coin”</text>
    </g>
    <g opacity="0.85">
      <rect x="576" y="196" width="140" height="46" rx="10" fill="#12304f" stroke="#5f7893" stroke-width="1.5"/>
      <text x="646" y="216" text-anchor="middle" fill="#8b9db1" font-size="12" font-weight="700" letter-spacing="1.1">ACTION</text>
      <text x="646" y="233" text-anchor="middle" fill="#c3d3e6" font-size="13">jump for it</text>
    </g>
    <!-- the missing piece -->
    <g>
      <rect x="356" y="196" width="140" height="46" rx="10" fill="none" stroke="#5f7893" stroke-width="1.5" stroke-dasharray="5 5"/>
      <text x="426" y="224" text-anchor="middle" fill="#5f7893" font-size="13" font-style="italic">nothing happens</text>
    </g>

    <path d="M598 98 Q636 122 646 190" fill="none" stroke="#5f7893" stroke-width="2" marker-end="url(#cl-dead)"/>
    <path d="M580 232 L504 232" fill="none" stroke="#5f7893" stroke-width="2" marker-end="url(#cl-dead)"/>

    <text x="536" y="166" text-anchor="middle" fill="#8b9db1" font-size="12.5">no reason to go round</text>
    <text x="536" y="183" text-anchor="middle" fill="#8b9db1" font-size="12.5">a second time</text>

    <text x="360" y="284" text-anchor="middle" fill="#c3d3e6" font-size="13.5">All three parts, or it is not a loop — it is a thing you did once.</text>
  </g>
</svg>
