<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img"
     aria-label="The same hit twice. On the left, only the rule runs: the enemy's health drops. On the right, the same rule plus five layers added on top — a flash, a knockback, particles, a screen shake and a sound — none of which change the rule."
     ><title>Juice: layers added around a rule that never changes</title>

  <defs>
    <marker id="jl-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5820a"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Roboto, Arial, sans-serif">

    <!-- ===== the rule alone ===== -->
    <text x="24" y="30" fill="#8b9db1" font-size="12.5" font-weight="700" letter-spacing="1.3">THE RULE, ON ITS OWN</text>
    <rect x="24" y="44" width="284" height="86" rx="10" fill="#12304f" stroke="#5f7893" stroke-width="1.5"/>
    <text x="166" y="76" text-anchor="middle" fill="#eaf1f8" font-size="14.5" font-weight="600" font-family="Consolas, monospace">health -= 10</text>
    <text x="166" y="100" text-anchor="middle" fill="#9fb2cc" font-size="13">The enemy is hurt.</text>
    <text x="166" y="119" text-anchor="middle" fill="#8b9db1" font-size="12.5">It reads as a spreadsheet.</text>

    <!-- ===== the same rule, wrapped ===== -->
    <text x="392" y="30" fill="#f5820a" font-size="12.5" font-weight="700" letter-spacing="1.3">THE SAME RULE, WRAPPED</text>

    <!-- the identical core, at the centre -->
    <rect x="470" y="128" width="180" height="52" rx="9" fill="#12304f" stroke="#5f7893" stroke-width="1.5"/>
    <text x="560" y="152" text-anchor="middle" fill="#eaf1f8" font-size="13.5" font-weight="600" font-family="Consolas, monospace">health -= 10</text>
    <text x="560" y="170" text-anchor="middle" fill="#8b9db1" font-size="11.5">unchanged</text>

    <!-- five layers around it -->
    <g font-size="12.5">
      <g>
        <rect x="392" y="48" width="132" height="36" rx="8" fill="#2e2410" stroke="#f5b02e" stroke-width="1.2"/>
        <text x="458" y="71" text-anchor="middle" fill="#f5b02e">flash white</text>
      </g>
      <g>
        <rect x="540" y="48" width="132" height="36" rx="8" fill="#2e2410" stroke="#f5b02e" stroke-width="1.2"/>
        <text x="606" y="71" text-anchor="middle" fill="#f5b02e">knock it back</text>
      </g>
      <g>
        <rect x="392" y="212" width="132" height="36" rx="8" fill="#2e2410" stroke="#f5b02e" stroke-width="1.2"/>
        <text x="458" y="235" text-anchor="middle" fill="#f5b02e">particles</text>
      </g>
      <g>
        <rect x="540" y="212" width="132" height="36" rx="8" fill="#2e2410" stroke="#f5b02e" stroke-width="1.2"/>
        <text x="606" y="235" text-anchor="middle" fill="#f5b02e">shake, a little</text>
      </g>
      <g>
        <rect x="466" y="262" width="188" height="36" rx="8" fill="#2e2410" stroke="#f5b02e" stroke-width="1.2"/>
        <text x="560" y="285" text-anchor="middle" fill="#f5b02e">a short, sharp sound</text>
      </g>
    </g>

    <g stroke="#f5820a" stroke-width="1.6" fill="none" marker-end="url(#jl-a)" opacity="0.85">
      <path d="M470 84 L508 124"/>
      <path d="M606 84 L606 124"/>
      <path d="M470 208 L508 184"/>
      <path d="M606 208 L606 184"/>
      <path d="M560 258 L560 184"/>
    </g>

    <!-- the point -->
    <text x="166" y="186" text-anchor="middle" fill="#c3d3e6" font-size="13.5" font-weight="600">Same numbers.</text>
    <text x="166" y="208" text-anchor="middle" fill="#9fb2cc" font-size="13">Same code doing the damage.</text>
    <text x="166" y="230" text-anchor="middle" fill="#9fb2cc" font-size="13">Completely different to play.</text>
    <text x="166" y="272" text-anchor="middle" fill="#f5d3a8" font-size="13">Juice is everything around</text>
    <text x="166" y="291" text-anchor="middle" fill="#f5d3a8" font-size="13">the rule, never the rule.</text>
  </g>
</svg>
