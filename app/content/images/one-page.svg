<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"
     aria-label="Six project files are joined into a single page, which the browser opens directly. Nothing is compiled and nothing is installed.">
  <title>Your six files become one page the browser can open</title>

  <defs>
    <marker id="op-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f7893"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Roboto, Arial, sans-serif">

    <!-- the six files, in load order -->
    <text x="24" y="30" fill="#8b9db1" font-size="12.5" font-weight="600">WHAT YOU WROTE</text>
    <g font-family="Consolas, monospace" font-size="12">
      <rect x="24" y="42" width="130" height="26" rx="6" fill="#0d2440" stroke="#2a4a6f"/>
      <text x="36" y="59" fill="#cfe0f2">config.js</text>
      <rect x="24" y="74" width="130" height="26" rx="6" fill="#0d2440" stroke="#2a4a6f"/>
      <text x="36" y="91" fill="#cfe0f2">world.js</text>
      <rect x="24" y="106" width="130" height="26" rx="6" fill="#0d2440" stroke="#2a4a6f"/>
      <text x="36" y="123" fill="#cfe0f2">player.js</text>
      <rect x="24" y="138" width="130" height="26" rx="6" fill="#0d2440" stroke="#2a4a6f"/>
      <text x="36" y="155" fill="#cfe0f2">coins.js</text>
      <rect x="24" y="170" width="130" height="26" rx="6" fill="#0d2440" stroke="#2a4a6f"/>
      <text x="36" y="187" fill="#cfe0f2">game.js</text>
      <rect x="24" y="202" width="130" height="26" rx="6" fill="#12304f" stroke="#3e8fd6"/>
      <text x="36" y="219" fill="#9ecbff">main.js</text>
    </g>
    <text x="24" y="248" fill="#5f7893" font-size="11.5">main.js is last on purpose:</text>
    <text x="24" y="264" fill="#5f7893" font-size="11.5">it starts the engine, so</text>
    <text x="24" y="280" fill="#5f7893" font-size="11.5">everything else must exist.</text>

    <line x1="164" y1="135" x2="216" y2="135" stroke="#5f7893" stroke-width="2" marker-end="url(#op-arrow)"/>

    <!-- joined into one page -->
    <rect x="226" y="42" width="196" height="186" rx="10" fill="#0a1626" stroke="#3ddc84" stroke-width="1.5"/>
    <text x="324" y="30" text-anchor="middle" fill="#3ddc84" font-size="12.5" font-weight="600">ONE PAGE</text>
    <g font-family="Consolas, monospace" font-size="11.5" fill="#8b9db1">
      <text x="240" y="64">&lt;script&gt; config  &lt;/script&gt;</text>
      <text x="240" y="84">&lt;script&gt; world   &lt;/script&gt;</text>
      <text x="240" y="104">&lt;script&gt; player  &lt;/script&gt;</text>
      <text x="240" y="124">&lt;script&gt; coins   &lt;/script&gt;</text>
      <text x="240" y="144">&lt;script&gt; game    &lt;/script&gt;</text>
      <text x="240" y="164" fill="#9ecbff">&lt;script&gt; main    &lt;/script&gt;</text>
    </g>
    <text x="324" y="196" text-anchor="middle" fill="#c9f5dc" font-size="12.5">glued together, in order</text>
    <text x="324" y="216" text-anchor="middle" fill="#8b9db1" font-size="11.5">nothing is compiled</text>

    <line x1="432" y1="135" x2="484" y2="135" stroke="#5f7893" stroke-width="2" marker-end="url(#op-arrow)"/>

    <!-- the browser runs it -->
    <text x="600" y="30" text-anchor="middle" fill="#8b9db1" font-size="12.5" font-weight="600">ANY BROWSER</text>
    <rect x="494" y="42" width="202" height="186" rx="10" fill="#0d2440" stroke="#2a4a6f" stroke-width="1.5"/>
    <rect x="494" y="42" width="202" height="26" rx="10" fill="#12304f"/>
    <circle cx="510" cy="55" r="4" fill="#5f7893"/><circle cx="524" cy="55" r="4" fill="#5f7893"/>
    <circle cx="538" cy="55" r="4" fill="#5f7893"/>
    <rect x="510" y="82" width="170" height="128" rx="6" fill="#0f2e22" stroke="#3ddc84"/>
    <text x="595" y="140" text-anchor="middle" fill="#3ddc84" font-size="14" font-weight="700">your game,</text>
    <text x="595" y="160" text-anchor="middle" fill="#3ddc84" font-size="14" font-weight="700">running</text>
    <text x="595" y="248" text-anchor="middle" fill="#eaf1f8" font-size="13" font-weight="600">Nothing installed.</text>
    <text x="595" y="266" text-anchor="middle" fill="#9fb2cc" font-size="12">Windows, Mac, Chromebook,</text>
    <text x="595" y="282" text-anchor="middle" fill="#9fb2cc" font-size="12">phone — the same one file.</text>
  </g>
</svg>
