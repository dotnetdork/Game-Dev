<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 352" role="img"
     aria-label="A variable drawn as a named box. The name, score, is written once. The box holds exactly one thing: right now a 5. The earlier values, 0 and 1, are drawn outside the box, faded and crossed out, because they are gone rather than stored alongside.">
  <title>A variable is a named box that holds exactly one thing at a time</title>

  <!-- Drawn to defeat a specific, measured misconception.
       Hermans and Swidan (WiPSCE 2018) put 496 novices, children and adults, through a controlled
       comparison of teaching a variable as a BOX against teaching it as a LABEL. On single
       assignments the box group did better. On CONSECUTIVE assignments — x = 5; x = 7 — the label
       group won, because a box is a container and a container can plausibly hold two things. That
       is the "multiple values" misconception, and it is one of the most durable in the literature.

       The previous version of this diagram drew three boxes stacked, holding 0, 1 and 5 — a
       picture of the misconception itself. So: ONE box, and the values it used to hold are drawn
       outside it, faded and struck through. The old values are not smaller, or greyer, or lower
       down; they are OUT. That is the whole idea, and it is the part a sentence alone loses. -->

  <defs>
    <marker id="bx-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f7893"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Roboto, Arial, sans-serif">

    <!-- the name: written once, never changes -->
    <text x="160" y="22" text-anchor="middle" fill="#8b9db1" font-size="11.5" font-weight="700" letter-spacing="1">THE NAME — WRITTEN ONCE</text>
    <rect x="70" y="32" width="180" height="34" rx="8" fill="#12304f" stroke="#3e8fd6" stroke-width="1.5"/>
    <text x="160" y="55" text-anchor="middle" fill="#9ecbff" font-size="15" font-weight="700"
          font-family="Consolas, monospace">score</text>

    <line x1="160" y1="66" x2="160" y2="94" stroke="#5f7893" stroke-width="2" marker-end="url(#bx-arrow)"/>

    <!-- the box: ONE box, ONE thing in it -->
    <text x="160" y="112" text-anchor="middle" fill="#8b9db1" font-size="11.5" font-weight="700" letter-spacing="1">ONE BOX. ONE THING IN IT.</text>
    <rect x="70" y="122" width="180" height="58" rx="8" fill="#0f2e22" stroke="#3ddc84" stroke-width="1.5"/>
    <text x="160" y="161" text-anchor="middle" fill="#3ddc84" font-size="26" font-weight="700"
          font-family="Consolas, monospace">5</text>

    <!-- what it held before: outside the box, and visibly gone -->
    <text x="160" y="208" text-anchor="middle" fill="#8b9db1" font-size="11.5" font-weight="700" letter-spacing="1">WHAT IT HELD BEFORE</text>

    <g font-family="Consolas, monospace">
      <rect x="70" y="218" width="80" height="38" rx="8" fill="none" stroke="#3c5068" stroke-dasharray="4 4"/>
      <text x="110" y="244" text-anchor="middle" fill="#5f7893" font-size="17" font-weight="700">0</text>
      <line x1="86" y1="237" x2="134" y2="237" stroke="#5f7893" stroke-width="1.5"/>

      <rect x="170" y="218" width="80" height="38" rx="8" fill="none" stroke="#3c5068" stroke-dasharray="4 4"/>
      <text x="210" y="244" text-anchor="middle" fill="#5f7893" font-size="17" font-weight="700">1</text>
      <line x1="186" y1="237" x2="234" y2="237" stroke="#5f7893" stroke-width="1.5"/>
    </g>

    <text x="160" y="276" text-anchor="middle" fill="#8b9db1" font-size="12.5">Gone — not sitting in the box next to the 5.</text>

    <!-- the point -->
    <rect x="20" y="292" width="280" height="44" rx="8" fill="#241d0e" stroke="#4a3c18"/>
    <text x="160" y="311" text-anchor="middle" fill="#e6d8b8" font-size="12.5">You never rename the box.</text>
    <text x="160" y="328" text-anchor="middle" fill="#c2b48f" font-size="12.5">You swap what is inside for one new thing.</text>
  </g>
</svg>
