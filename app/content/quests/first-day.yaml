# The first day: the studio's first shift (docs/rework/v2-spec.md §4; the beats are wireframe 04's,
# reworked by Jay's playthrough, docs/rework/v2-review-2026-09-28.md §4).
# The kid plays the intern's broken greybox level, then TELLS the Mentor what they found, in their own
# words; each finding becomes a ticket. They pick one and its department fixes it with them (the
# ticket's own quest runs inside this one). Then they make the Play-mode mistake, fix the rest of the
# board, and only then describe their hero. Nothing here narrates a problem for them.
id: first-day
title: Your first day
department: studio
character: mentor
next_quest: own-game
beats:
  - id: clock-in
    say:
      - Welcome to the studio, @name! Our last intern left this game half-broken, so let’s see how bad it is.

  - id: press-play
    goal: Play the game and look for anything broken
    do: { reveal: [game, play], point: game, cue: play }
    instruct: Press Play up top to test it.
    on:
      # the keys are on the game itself while it starts (editor.js, hint), not a line in the chat
      - when: { play: true }
        once: true
        instruct: Look for anything broken. Press Stop when you’ve found something.
      - when: { stop: true, seen_none: true }
        say:
          - Nothing broken yet?
        instruct: Press Play and explore a bit further.
    hints_after: 30
    hints:
      - Explore the whole level, left to right.
      - Try everything. Walk on things, grab things, touch things.
      - Walk right from the start, carefully. Watch the floor.
    wait_for: { stop: true, seen_at_least: 1 }

  - id: report
    goal: Tell the Mentor what was broken
    # No suggestions: what the kid found is the point (Jay, Sept 30). The hints say where to look and
    # how to put it, never what; "idk" gives the next one (chat.js, answer).
    ask:
      text: What was broken? Tell me what happened, and I’ll write it up as a ticket.
      from: findings
      if_none: press-play
    hints_after: 30
    hints:
      - Think back to your test. Did anything look, sound or act wrong?
      - Say what happened and where, like “the jump feels floaty”.
      - Not sure? Press Play again and try everything, then tell me.

  - id: what-first
    goal: Pick a ticket to fix first
    # The departments file whatever the kid didn't report (spec D44): a colleague would have spotted
    # it, and a missed finding must never stall the day. One finding is enough to get here.
    do: { file: rest, reveal: [tickets] }
    say:
      - Each ticket goes to the department that fixes it.
    ask:
      text: What should we fix first?
      from: tickets

  - id: play-mode
    goal: Make the coins bigger while the game runs, then press Stop
    character: mentor
    do: { reveal: [hierarchy], allow: [coinSize], play: true, cue: coins.size }
    say:
      - Quick test while it’s running.
    instruct: Tap Coins, then make them bigger.
    on:
      - when: { set: { part: coins, key: size, gt: 1.2 }, playing: true, not_flag: grew }
        flag: grew
        say:
          - Bigger!
        instruct: Now press Stop.
        cue: stop
      - when: { set: { part: coins, key: size }, playing: false }
        say:
          - That one stuck, because the game wasn’t running.
        instruct: Press Play and try again.
      - when: { stop: true, not_flag: grew }
        instruct: Press Play again, then make the coins bigger while it runs.
    hints_after: 25
    hints:
      - Coins is in the Hierarchy, on the left.
      - Its Transform has a Scale. Make it bigger than 1.
    wait_for: { reverted: true, flag: grew }
    award: { card: play-mode }
    done_say:
      - They shrank back! Play mode is a test run, and Stop puts everything back, the same as in Unity.

  # The board first, then the hero (Jay, Sept 30: "its asking me all these things before I even
  # finish the tickets"). The hero and the name had come straight after the first ticket, with three
  # still open. The name is not asked on the first day at all: "That can be covered when we get into
  # game design documents" (design.js; askName stays in quest.js for that).
  - id: next-ticket
    goal: Pick your next ticket
    do: { stop: true, reveal: [tickets] }
    ask:
      text: What should we fix next?
      from: tickets
      then: again          # back here after each ticket, until the board is clear

  # The design meeting (spec D47-D50; Jay, Sept 30: "After they complete all the beats, before the
  # create a character, I'd like them to move on to building a game design document"). It opens on
  # the cards the board earned them, since every game has those, then round 1 (studio/design.js) asks
  # the core of THEIR game into the Design doc tab: the idea, how you play, the goal, the fun.
  - id: its-yours
    do: { stop: true, close_inspector: true, reveal: [doc] }
    say:
      - The board is clear, @name! Fixing it earned you {cards}. Every game has those.
      - Now let’s design YOUR game. I’ll write it down as we go.

  - id: design-1
    goal: Plan your game with the Mentor
    ask:
      text: Four quick questions, then we build it.
      from: design
      round: 1

  # The hero is Art's to draw, and within Art the concept artist's, who designs characters and assets
  # (Jay, Sept 30: "this here should be a handoff to a specific branch of the art department that
  # handles designing assets"). The Mentor guides the day; the departments do the work. Round 1's
  # last line hands over to them (design.js ROUNDS), so the hero is part of the meeting.
  - id: your-hero
    goal: Describe your game’s hero
    character: concept-artist
    ask:
      text: Hi @name! Every game needs a hero. What’s yours? A dragon, a robot, a pizza… anything!
      from: heroes
      examples: [A dragon, A robot, A cat, A pizza with legs]
    award: { card: player-character }   # the doc's hero section's concept (spec D50)

  - id: play-yours
    goal: Play your game and grab a coin
    do: { play: true, reveal: [stars] }
    say:
      - Your game, @name!
    instruct: Grab a coin.
    wait_for: { event: coin }
    award: { stars: 1 }
    done_say:
      - Your first star!

  # Then they build it (spec D49; Jay's pick: "the running list is the ticket board"). What round 1
  # decided goes on the board as tickets, each for the department that builds it, and the kid picks
  # them the way they picked the tutorial's: the same loop, now on their own game (doc-ticket.yaml).
  - id: file-design
    do: { stop: true, file: design, reveal: [tickets] }
    say:
      - Each department builds its part of your design, with you.

  - id: build-yours
    goal: Pick a ticket from your design
    ask:
      text: Which one should we build first?
      from: tickets
      then: again          # back here after each one, until the board is clear
