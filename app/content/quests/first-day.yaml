# The first day: the studio's first shift (docs/rework/v2-spec.md §4; the beats are wireframe 04's,
# reworked by Jay's playthrough, docs/rework/v2-review-2026-09-28.md §4).
# The kid plays the intern's broken greybox level, then TELLS the Mentor what they found, in their own
# words; each finding becomes a ticket. They pick one and its department fixes it with them (the
# ticket's own quest runs inside this one). Then they make the Play-mode mistake, describe their hero,
# name their game, and fix the rest of the board. Nothing here narrates a problem for them.
id: first-day
title: Your first day
department: studio
character: mentor
next_quest: own-game
beats:
  - id: clock-in
    say:
      - Welcome to the studio, @name! Our last intern left this game half-broken, so let’s see how bad it is.

  - id: press-play
    goal: Play the game and look for anything broken
    do: { reveal: [game, play], point: game, cue: play }
    instruct: Press Play up top to test it.
    on:
      # the keys are on the game itself while it starts (editor.js, hint), not a line in the chat
      - when: { play: true }
        once: true
        instruct: Look for anything broken. Press Stop when you’ve found something.
      - when: { stop: true, seen_none: true }
        say:
          - Nothing broken yet?
        instruct: Press Play and explore a bit further.
    hints_after: 30
    hints:
      - Explore the whole level, left to right.
      - Try everything. Walk on things, grab things, touch things.
      - Walk right from the start, carefully. Watch the floor.
    wait_for: { stop: true, seen_at_least: 1 }

  - id: report
    goal: Tell the Mentor what you found
    ask:
      text: What did you find? Tell me in your own words.
      from: findings
      if_none: press-play

  - id: what-first
    goal: Pick a ticket to fix first
    # The departments file whatever the kid didn't report (spec D44): a colleague would have spotted
    # it, and a missed finding must never stall the day. One finding is enough to get here.
    do: { file: rest, reveal: [tickets] }
    say:
      - Each ticket goes to a department, and you pick which we fix first.
    ask:
      text: What should we fix first?
      from: tickets

  - id: play-mode
    goal: Make the coins bigger while the game runs, then press Stop
    character: mentor
    do: { reveal: [hierarchy], allow: [coinSize], play: true }
    say:
      - Quick test while it’s running.
    instruct: Tap Coins, then make them bigger.
    on:
      - when: { set: { part: coins, key: size, gt: 1.2 }, playing: true, not_flag: grew }
        flag: grew
        say:
          - Bigger!
        instruct: Now press Stop.
        cue: stop
      - when: { set: { part: coins, key: size }, playing: false }
        say:
          - That one stuck, because the game wasn’t running.
        instruct: Press Play and try again.
      - when: { stop: true, not_flag: grew }
        instruct: Press Play again, then make the coins bigger while it runs.
    hints_after: 25
    hints:
      - Coins is in the Hierarchy, on the left.
      - Its Transform has a Scale. Make it bigger than 1.
    wait_for: { reverted: true, flag: grew }
    award: { card: play-mode }
    done_say:
      - They shrank back! Play mode is a test run, and Stop puts everything back, the same as in Unity.

  - id: its-yours
    goal: Describe your game’s hero
    do: { stop: true, close_inspector: true }
    say:
      - This level is yours now, @name, and every fix goes into YOUR game.
    ask:
      text: Every game needs a hero. What’s yours? A dragon, a robot, a pizza… anything!
      from: heroes
      examples: [A dragon, A robot, A cat, A pizza with legs]

  - id: name-it
    goal: Give your game a name
    ask:
      text: And what’s your game called?
      from: names

  - id: play-yours
    goal: Play your game and grab a coin
    do: { play: true }
    say:
      - Your game, @name!
    instruct: Grab a coin.
    wait_for: { event: coin }
    award: { stars: 1 }
    done_say:
      - Your first star!

  - id: next-ticket
    goal: Pick your next ticket
    do: { stop: true, reveal: [tickets, stars] }
    ask:
      text: What should we fix next?
      from: tickets
      then: again          # back here after each ticket, until the board is clear
