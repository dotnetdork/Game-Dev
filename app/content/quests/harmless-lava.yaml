# Design's first shift: the lava does nothing (ticket: harmless-lava). Concept: risk. A designer's
# rule (a Hazard script) makes touching it send you back; then the kid has to get past it.
id: harmless-lava
title: The harmless lava
department: design
character: lead-designer
ticket: harmless-lava
concept: risk
allow: [hazard]
on:
  - when: { reverted: true }
    say:
      - "It changed back! Changes made while playing are undone on Stop. Turn the rule on while it’s stopped."
beats:
  - id: meet
    do: { reveal: [hierarchy], point: hierarchy, stop: true }
    say:
      - Hi @name, I’m the lead designer! Lava that doesn’t hurt isn’t scary. Tap Lava in the Hierarchy.
    skip_if: { state: { lava.hurts: true } }
    wait_for: { select: lava }

  - id: fix
    say:
      - Its Hazard script is a designer’s rule. Turn on Hurts player.
    skip_if: { state: { lava.hurts: true } }
    on:
      - when: { set: { part: lava, key: hurts, value: false } }
        say:
          - "That turned it off. Turn Hurts player on, then test it."
    wait_for: { state: { lava.hurts: true } }

  - id: feel-it
    do: { cue: play }
    say:
      - Press Play and step in the lava. Carefully!
    wait_for: { event: hurt }
    done_say:
      - Ouch! Back to the start.

  - id: beat-it
    say:
      - Now jump over it and grab the far coin.
    wait_for: { event: coin }
    pass: true
    done_say:
      - You made it! Danger makes a game exciting.

  - id: name-it
    do: { stop: true }
    award: { card: risk }
    ask:
      text: Why did the game get more fun with real lava?
      answers:
        - text: There was a risk to beat
          correct: true
          say:
            - "Yes! Designers call it risk. Something to lose makes getting past it feel good."
          goto: next
        - text: The lava looked cooler
          say:
            - "It looked the same! What changed is it could send you back. That’s risk, and beating it feels good."
          goto: next
        - text: It didn’t
          say:
            - "Fair! But most players like a challenge. Something to lose is called risk."
          goto: next
