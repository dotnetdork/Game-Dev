# Art's first shift: everything is grey (ticket: greybox). Concept: readability. The level is a
# greybox, the grey blockout studios test with before Art; giving parts sprites makes it readable.
# The sprites are drawn by the game's own code (starter/game.js, SPRITES).
id: greybox
title: The greybox
department: art
character: art-director
ticket: greybox
concept: readability
allow: [coinArt, lavaArt]
on:
  - when: { reverted: true }
    say:
      - It changed back! Changes made while playing are undone on Stop.
    instruct: Pick sprites while the game is stopped.
beats:
  - id: meet
    goal: Find the coins in the Hierarchy
    do: { reveal: [hierarchy], point: hierarchy, stop: true, cue: coins }
    say:
      - Hi @name, I’m the art director! This greybox is plain blocks for testing, so a player can’t tell good from dangerous.
    skip_if: { state: { coins.look: set, lava.look: set } }
    hints_after: 20
    hints:
      - Every part is in the Hierarchy, on the left.
      - Tap Coins in the Hierarchy.
    wait_for: { select: coins }

  - id: fix
    goal: Give the coins and the lava a picture
    do: { cue: coins.look }
    say:
      - The Inspector shows the Coins’ components. The Sprite Renderer draws a part’s picture, and this one has none yet.
    instruct: Give the coins a sprite, then the Lava.
    on:
      - when: { set: { part: coins, key: look }, state: { lava.look: null } }
        say:
          - Nice!
        instruct: Now the Lava.
        cue: lava.look
      - when: { set: { part: lava, key: look }, state: { coins.look: null } }
        say:
          - Scary!
        instruct: Now the Coins.
        cue: coins.look
    hints_after: 25
    hints:
      - Look for the Sprite Renderer in the Inspector.
      - Its Sprite field says None. Tap it to pick a picture, or drag one in from the Project window.
      - Do the same for the Lava. Tap Lava in the Hierarchy first.
    wait_for: { state: { coins.look: set, lava.look: set } }

  - id: test
    goal: Play and grab a coin
    do: { cue: play }
    say:
      - Can you spot the coins now?
    instruct: Press Play and grab one.
    wait_for: { event: coin }
    pass: true
    done_say:
      - See how they pop? Art shows players what matters.

  - id: name-it
    goal: "Pick an answer: what did the sprites do for the player?"
    do: { stop: true }
    award: { card: readability }
    ask:
      text: What did the sprites do for the player?
      answers:
        - text: Showed what matters
          sub: A player can tell things apart
          correct: true
          say:
            - Right. Artists call that readability, seeing at a glance what’s good and what’s dangerous.
        - text: Made it faster
          sub: The game runs quicker
          say:
            - Speed didn’t change. Think about what a player can see now. Try again!
        - text: Nothing, just pretty
          sub: It only looks nicer
          say:
            - Pretty helps. But could a player tell coin from lava before? Try again!