# Audio's first shift: coins make no sound (ticket: silent-coins). Concept: feedback. The sound
# belongs to the part (an Audio Source on the Coins), as in Unity, and is tested in play.
id: silent-coins
title: The silent coins
department: audio
character: sound-designer
ticket: silent-coins
concept: feedback
allow: [coinSound]
on:
  - when: { reverted: true }
    say:
      - It changed back! Changes made while playing are undone on Stop.
    instruct: Pick the sound while the game is stopped.
beats:
  - id: meet
    # direct: says what to click (floor-is-a-picture.yaml, meet)
    goal: Click Coins in the Hierarchy
    do: { reveal: [hierarchy], point: hierarchy, stop: true, cue: coins }
    say:
      - Hi @name, I’m the sound designer! A silent coin doesn’t feel like anything, so let’s fix that.
    instruct: Go ahead and click Coins in the Hierarchy.
    skip_if: { state: { coins.sound: set } }
    hints_after: 20
    hints:
      - The Hierarchy is the list on the left. It has every part of the level in it.
      - Click the words Coins in that list. The sound belongs to them.
    wait_for: { select: coins }

  - id: fix
    goal: Give the coins a sound
    do: { cue: coins.sound }
    say:
      - The Inspector shows the Coins’ components, the pieces that make them work. In Unity a sound lives on the part that makes it.
    instruct: Find where the coin’s sound would go.
    skip_if: { state: { coins.sound: set } }
    hints_after: 25
    hints:
      - Look for the component that holds a sound.
      - It’s the Audio Source. Its Clip is None.
      - Tap the Clip and pick a sound, or drag one in from the Project window.
    wait_for: { state: { coins.sound: set } }

  - id: test
    goal: Play, grab a coin, and listen
    do: { cue: play }
    instruct: Now press Play, grab a coin, and listen.
    wait_for: { event: coin, state: { coins.sound: set } }
    pass: true
    done_say:
      - Hear that? Now the game answers you.

  - id: name-it
    goal: "Pick an answer: why does a coin need a sound?"
    do: { stop: true }
    award: { card: feedback }
    ask:
      text: Why does a coin need a sound?
      answers:
        - text: So you know you got it
          sub: The sound tells you something happened
          correct: true
          say:
            - Exactly. Game designers call that feedback, the game telling you what just happened.
        - text: To make it louder
          sub: More noise makes it better
          say:
            - Loud isn’t the point. What does the sound tell you? Try again!
        - text: Coins always ding
          sub: Every game does it that way
          say:
            - Only if someone adds it! What does the ding tell you? Try again!