# The problems a kid can find in the intern's level (docs/rework/v2-spec.md §2.2).
#
# NEVER NARRATE WHAT THE KID HASN'T NOTICED (review §4, rule 1). On the first day a problem the game
# shows is only SEEN (`found_by`, checked against every event); it becomes a ticket when the kid
# says they found it, in their own words, and the ticket keeps those words. `words` is how the studio
# recognises a finding without the AI (a regular expression, case ignored); the AI, when it is up,
# recognises the rest. After the first report, a problem the kid runs into is filed at once, with a
# row in the chat saying so, and never lost.
#
# `title` is the ticket's name on the board, written the way a studio writes a bug report (Jay,
# 2026-09-29: "more professional, clear title"); the kid's own words stay on the ticket's page, as
# "You reported". `says` is the finding as a kid would put it, shown only to the AI as an example when
# it matches a report to a problem. It is never offered to the kid: a card of findings gave the
# answers away (Jay, 2026-09-30). `detail` is what the ticket's page says is wrong, and `done` how the
# kid will know it's fixed.
#
# `should_ask` and `should` teach the other half of a bug report, what SHOULD have happened (Jay,
# 2026-09-30: "a kid isn't going to know the direct answer ... they need to be taught the answer by
# the AI pushing them deeper into explaining it"). Once a finding is filed the Mentor asks what should
# have happened; a kid who doesn't know gets `should_ask`, a question that leads there from what any
# player knows; still stuck, the Mentor says `should`. Neither names a problem the kid hasn't found.
# It is asked once, for the first finding; after that the Mentor says `should` itself (quest.js,
# filed). `should_q` replaces "What should have happened instead?" for a problem that is a look.
#
# `nudge` is for "that's all" said with problems still unfound (Jay, 2026-09-30: "The bot should have
# responded with are you sure?"). The Mentor asks "Are you sure?" and sends them to look, one problem
# at a time: a question about WHERE to look, never what is wrong. `nudge_yes` is what an answer to it
# can be that means they found it ("nothing", to what did you hear), on top of `words`. Not found
# after one more try, it is left for its department to file.
#
# `quest` is the department shift that fixes it; `fixed_when` closes it early if the kid (or the AI)
# fixes it first.
tickets:
  - id: floor
    title: The player falls through a floor tile
    says: I fell through the floor
    detail: Part of the floor looks solid, but the player drops right through it.
    done: The player can walk across the whole floor without falling.
    should_ask: When you walk onto a floor in a game, what should it do?
    should: A floor should hold you up, so you can walk across it.
    nudge: What happened when you walked across the middle of the floor?
    nudge_yes: "sank|gap|went (down|through)|under"
    department: engineering
    quest: floor-is-a-picture
    found_by: { event: fell }
    # what happened, not the thing it happened to: "floor" was here, and "a gap in the floor between
    # the coins that does nothing", which is the lava, was told it was this ticket (Jay, Sept 30)
    words: "fell|fall|through|drop|sank|sink|hole"
    fixed_when: { state: { tile.solid: true } }

  - id: silent-coins
    title: Coins make no sound when grabbed
    says: The coins don’t make a sound
    detail: Grabbing a coin is silent, so the player can’t tell they got it.
    done: Every coin plays a sound when the player grabs it.
    should_ask: When you grab a coin in a game, how do you usually know you got it?
    should: A coin should make a sound, so you know you got it.
    nudge: What did you hear when you grabbed a coin?
    nudge_yes: "nothing|no ?thing|none|didn['’]?t hear|did not hear"
    department: audio
    quest: silent-coins
    found_by: { event: coin, state: { coins.sound: null } }
    words: "sound|quiet|silent|noise|hear|ding|audio|mute"
    fixed_when: { state: { coins.sound: set } }

  - id: greybox
    title: The whole level is grey boxes
    says: Everything is grey
    detail: Every part is a plain grey block, so a player can’t tell coins from danger.
    done: The coins and the lava each have a picture a player can tell apart.
    # a look, not something that happens: "happened? dont you mean look like?" (Jay, Sept 30)
    should_q: What should it look like instead?
    should_ask: If everything looks the same, how would a player tell a coin from lava?
    should: Each thing should look different, so a player can tell good from dangerous.
    # what colour, not "how can you tell which is which?": "their shape" was a fair answer to that, and
    # the AI argued with it and said the problem itself (Jay's playthrough, Sept 30)
    nudge: Look at the coins and the lava. What colour is each one?
    nudge_yes: "gr[ae]y|both|same|can['’]?t|cannot|no way|not really|hard to"
    department: art
    quest: greybox
    # Not found by an event: it is plain to see. If the kid doesn't say it, the art director files it
    # herself (first-day.yaml), as a colleague would.
    # not "boring" or "ugly": those are feelings, and the Mentor asks what made them (quest.js, FEEL)
    words: "gr[ae]y|colou?r|plain|blank|art|picture|block"
    fixed_when: { state: { coins.look: set, lava.look: set } }

  - id: harmless-lava
    title: The lava doesn’t hurt the player
    says: The lava doesn’t hurt
    detail: The dip between the coins is meant to be lava, but touching it does nothing.
    done: Touching the lava sends the player back to the start.
    should_ask: In most games, what happens when you touch lava?
    should: Lava should hurt you, so it is something to get past.
    # In a grey level nothing says which grey shape is lava (Jay, Sept 30: "theres no way to know thats
    # lava"), so the nudge says what it is and where, and still not what is wrong with it.
    nudge: See the dip in the floor between the coins? That’s meant to be lava. What happened when you walked into it?
    nudge_yes: "nothing|no ?thing|didn['’]?t (die|hurt|do)|was fine|walked (on|over|through)|stood"
    department: design
    quest: harmless-lava
    found_by: { event: lava }
    # and what a kid sees there before they know it is lava: a gap, a dip, a pit that does nothing
    words: "lava|hurt|damage|die|danger|safe|burn|gap|dip|pit|dent|does nothing|nothing happens"
    fixed_when: { state: { lava.hurts: true } }
