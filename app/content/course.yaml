# Course structure. Edit to add/reorder modules and lessons.
# Each lesson id maps to content/lessons/<id>.md
#
# Six modules, 30 lessons. Module names are labels, not sentences.
#
# There is no "welcome / how this works" module on purpose — that job belongs to the first-run
# tour, which highlights the real buttons instead of describing them.
#
# ---- the shape of it, and why ----
#
# Every module ends in a CHECKPOINT (`checkpoint: true` in the lesson's front-matter): the one
# lesson in that module about the student's OWN game rather than the course's. They are what makes
# the arc Use -> Modify -> Create instead of stopping at Modify, and they are why the module's stars
# wait — you cannot arrive at the part where you build your own game having built nothing.
#
# Concept Ideation is second, not first. Not first because the course has to open with a game being
# played rather than a worksheet, and because at minute zero a student has no words to describe an
# idea with — not "sprite", not "collision". Not later, because the five Core Mechanics lessons
# after it are every one of them a decision about a game, and a student with no game in mind reads
# them as trivia. Second is where those two pull even.
#
# It is also deliberately CONSTRAINED ideation: one starter game, reshaped. "Invent a game" is the
# one shape known to fail here — the League's own experience is that most students freeze on a blank
# page and the rest spend the term on a sprite. So the module asks what this platformer becomes,
# which keeps every idea buildable.
#
# The student's answers live in `design.md` in their project (see starter-code.js) and each later
# checkpoint cashes in one line of it. That is what stops a design doc being homework: it is the
# backlog, not a document.
#
# Games kids know (Mario, Minecraft, Fortnite, RuneScape, Roblox) appear all through the course as
# familiar examples while a mechanic is being explained. They are never the subject of a lesson.
# We are not teaching Fortnite; we are teaching what makes a game work, using something they have
# already played so the idea lands.
#
# The assets lesson is SECOND, before physics, and its "your turn" is a purchase. Every student
# starts with 400 Stars and nothing used to tell them so until lesson 27 - so for twenty-six
# lessons every screen in the room showed the same game. Now the second lesson ends with a
# character they chose. Identity is most of what keeps a twelve-year-old going.
#
# from-project-to-playable was cut (2026-09-09): 765 words on .exe-versus-web builds for a student
# who will never make an .exe. It is in content/_archive-v1/ with its openers.
#
# The v1 course (47 shorter lessons) is kept in content/_archive-v1/ .
id: course1
name: "Game Dev — Level 1"
library: Phaser
modules:
  - id: engines
    name: "Game Engines"
    stars: 120
    lessons: [what-an-engine-does, what-a-game-is-made-of, physics-and-collision, your-game-in-one-line]

  - id: ideation
    name: "Concept Ideation"
    stars: 130
    lessons: [where-ideas-come-from, scope-and-cutting, design-on-one-page, your-one-sheet]

  - id: mechanics
    name: "Core Mechanics"
    stars: 140
    lessons: [the-core-loop, feedback, difficulty-and-flow, risk-and-reward, progression, cut-it-down]

  - id: phaser
    name: "Phaser Programming"
    stars: 160
    lessons: [values-and-variables, decisions-and-repeats, scenes-create-update, input-movement-collision, reading-an-error, build-your-first-mechanic]

  - id: architecture
    name: "Systems Architecture"
    stars: 150
    lessons: [game-state, entities-and-components, events-not-tangles, data-out-of-code, room-to-grow]

  - id: assets
    name: "Asset Design"
    stars: 130
    lessons: [sprites-and-animation, sound-design, juice, ship-it, launch-your-game]
