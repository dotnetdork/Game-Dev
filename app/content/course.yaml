# Course structure. Edit to add/reorder modules and lessons.
# Each lesson id maps to content/lessons/<id>.md
#
# Five modules, 22 lessons. Module names are labels, not sentences.
#
# There is no "welcome / how this works" module on purpose — that job belongs to the first-run
# tour, which highlights the real buttons instead of describing them.
#
# Games kids know (Mario, Minecraft, Fortnite, RuneScape, Roblox) appear all through the course as
# familiar examples while a mechanic is being explained. They are never the subject of a lesson.
# We are not teaching Fortnite; we are teaching what makes a game work, using something they have
# already played so the idea lands.
#
# The v1 course (47 shorter lessons) is kept in content/_archive-v1/ .
id: course1
name: "Game Dev — Level 1"
library: Phaser
modules:
  - id: engines
    name: "Game Engines"
    stars: 120
    lessons: [what-an-engine-does, physics-and-collision, what-a-game-is-made-of, from-project-to-playable]

  - id: mechanics
    name: "Core Mechanics"
    stars: 140
    lessons: [the-core-loop, feedback, difficulty-and-flow, risk-and-reward, progression]

  - id: phaser
    name: "Phaser Programming"
    stars: 160
    lessons: [values-and-variables, decisions-and-repeats, scenes-create-update, input-movement-collision, reading-an-error]

  - id: architecture
    name: "Systems Architecture"
    stars: 150
    lessons: [game-state, entities-and-components, events-not-tangles, data-out-of-code]

  - id: assets
    name: "Asset Design"
    stars: 130
    lessons: [sprites-and-animation, sound-design, juice, ship-it]
