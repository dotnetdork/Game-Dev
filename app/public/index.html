<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEAGUE - CodeQuest</title>
<!-- League branding assets, self-hosted under public/img/. -->
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#102a49">
<!-- Libraries are vendored under public/vendor/ so the app keeps working on filtered
     school networks with no CDN access. See public/vendor/VENDORED.md to refresh them. -->
<link rel="stylesheet" href="vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="vendor/codemirror/theme/material-darker.css">
<link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.css">
<link rel="stylesheet" href="vendor/codemirror/addon/lint/lint.css">
<link rel="stylesheet" href="vendor/codemirror/addon/fold/foldgutter.css">
<link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.css">
<link rel="stylesheet" href="vendor/mdi/css/materialdesignicons.min.css">
<link rel="stylesheet" href="styles.css">
<body>
  <a class="skiplink" href="#view-learn">Skip to the lesson</a>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="img/wordmark.png" alt="The League of Amazing Programmers"><span class="brand-tag">CodeQuest</span></div>
    <nav class="topnav" aria-label="Sections">
      <button class="navitem on" data-page="courses"><span class="mdi mdi-school"></span>Courses</button>
      <button class="navitem" data-page="store"><span class="mdi mdi-cart-outline"></span>Store</button>
      <button class="navitem" data-page="gallery"><span class="mdi mdi-view-grid"></span>Gallery</button>
      <button class="navitem" data-page="leaderboards"><span class="mdi mdi-podium"></span>Leaderboards</button>
    </nav>
    <nav class="topright" aria-label="Reference">
      <button class="navitem" data-page="docs"><span class="mdi mdi-book-open-variant"></span>Docs</button>
      <button class="navitem" data-page="help"><span class="mdi mdi-help-circle-outline"></span>Help</button>
    </nav>
  </header>

  <div class="stage-wrap">
    <button id="aiFab" class="ai-fab" title="Open the assistant" hidden><span class="mdi mdi-robot-happy-outline"></span></button>
    <div class="editor" id="editor">
      <aside class="dock left" aria-labelledby="leftTitle">
        <div class="res r" id="resLeft"></div>
        <div class="dock-head" id="leftTitle">Course Outline</div>
        <div class="dock-body">
          <div id="panel-outline"><div id="tree"></div></div>
          <div id="panel-files" hidden>
            <div id="fileList"></div>
            <div class="fileactions">
              <button class="iconbtn" id="newFileBtn" title="New script"><span class="mdi mdi-file-plus-outline"></span>New</button>
              <button class="iconbtn" id="saveBtn" title="Save"><span class="mdi mdi-content-save-outline"></span>Save</button>
              <button class="iconbtn" id="runBtn" title="Save & run"><span class="mdi mdi-play"></span>Run</button>
            </div>
          </div>
          <div id="panel-info" hidden>
            <div class="info-hd">Current settings</div>
            <div id="infoSettings"></div>
            <button class="iconbtn" id="resetGameBtn" title="Restore the original starter game" style="margin:14px 12px;"><span class="mdi mdi-restore"></span>Reset game</button>
          </div>
        </div>
      </aside>

      <main class="center">
        <div class="viewbar">
          <span class="crumb" id="crumb">Welcome</span>
          <div class="vtabs" role="tablist" aria-label="Lesson view">
            <button class="vtab on" data-view="learn" role="tab" aria-selected="true" aria-controls="view-learn"><span class="mdi mdi-book-open-page-variant"></span>Learn</button>
            <button class="vtab" data-view="code" role="tab" aria-selected="false" aria-controls="view-code"><span class="mdi mdi-code-tags"></span>Code</button>
            <button class="vtab" data-view="play" role="tab" aria-selected="false" aria-controls="view-play"><span class="mdi mdi-gamepad-variant"></span>Play</button>
          </div>
        </div>
        <div class="viewbody">
          <div class="view" id="view-learn" role="tabpanel" tabindex="-1"><div class="lesson" id="lessonBody"></div></div>
          <div class="view" id="view-code" role="tabpanel" tabindex="-1" hidden>
            <div class="review-bar" id="reviewBar" hidden>
              <span class="mdi mdi-file-compare"></span>
              <span class="rv-title">Suggested change</span>
              <span class="rv-stat" id="reviewStat"></span>
              <button class="rv-apply" id="reviewApply"><span class="mdi mdi-check"></span>Apply</button>
              <button class="rv-skip" id="reviewSkip">No thanks</button>
            </div>
            <textarea id="codeeditor"></textarea><div class="cm-statusbar" id="cmStatus">Ln 1, Col 1</div>
          </div>
          <div class="view" id="view-play" role="tabpanel" tabindex="-1" hidden>
            <div class="stage" id="gameStage">
              <div class="stage-frame">
                <iframe id="gameFrame" title="Game viewport"></iframe>
                <div class="game-loading hidden" id="gameLoading"><span class="spin"></span>Building your game…</div>
              </div>
            </div>
          </div>
        </div>
        <div class="console" id="console" hidden>
          <div class="console-head">
            <button class="con-toggle" id="conToggle" title="Show or hide the log"><span class="mdi mdi-chevron-down"></span></button>
            <span class="con-title"><span class="mdi mdi-console-line"></span>Console</span>
            <div class="game-audio" id="gameAudio" title="Game sound"><button id="muteBtn" title="Sound is off — click to turn it on"><span class="mdi mdi-volume-off"></span></button><input type="range" id="volSlider" aria-label="Game volume" min="0" max="100" value="50" disabled></div>
            <button class="con-clear" id="conClear" title="Clear the log">Clear</button>
          </div>
          <div class="console-body" id="consoleBody"></div>
        </div>
      </div>

      <aside class="dock right" aria-label="AI assistant">
        <div class="res l" id="resRight"></div>
        <div class="dock-head">
          <span class="ai-title"><img class="ai-ava" src="img/clearRobotRing4.png" alt="">AI Assistant</span>
          <button class="ai-toggle coder" id="modeToggle" title="Build mode — click to switch to Tutor"><span class="mdi mdi-code-tags"></span></button>
          <span class="tag" id="aiModelTag">model…</span>
          <button class="ai-collapse" id="aiCollapse" title="Hide the assistant"><span class="mdi mdi-chevron-right"></span></button>
        </div>
        <div class="ai">
          <div class="ai-msgs" id="aiMsgs"></div>
          <div class="ai-input">
            <input id="aiText" placeholder="Ask the AI to change your game...">
            <button id="aiSend" title="Send"><span class="mdi mdi-send"></span></button>
          </div>
        </div>
      </aside>
    </div>

    <div class="page" id="page" hidden></div>
  </div>

  <footer class="statusbar">
    <span class="sb-left">CodeQuest — v0.1.0</span>
    <div class="sb-mid">
      <span><span class="mdi mdi-star st"></span> <b id="starVal">0</b></span>
      <div class="progress" title="XP to next level"><div id="xpBar"></div></div>
      <span class="xp"><img class="xp-bolt" src="img/bolt.png" alt="XP"> <b id="xpVal">0</b> XP</span>
      <span>Lvl <b id="lvlVal">1</b></span>
    </div>
    <span class="sb-right">© The League of Amazing Programmers</span>
  </footer>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modalBack" hidden></div>

<script src="vendor/codemirror/lib/codemirror.js"></script>
<script src="vendor/codemirror/mode/javascript/javascript.js"></script>
<script src="vendor/codemirror/addon/edit/matchbrackets.js"></script>
<script src="vendor/codemirror/addon/edit/closebrackets.js"></script>
<script src="vendor/codemirror/addon/selection/active-line.js"></script>
<script src="vendor/codemirror/addon/comment/comment.js"></script>
<script src="vendor/codemirror/addon/hint/show-hint.js"></script>
<script src="vendor/codemirror/addon/hint/anyword-hint.js"></script>
<script src="vendor/codemirror/addon/hint/javascript-hint.js"></script>
<script src="vendor/codemirror/addon/fold/foldcode.js"></script>
<script src="vendor/codemirror/addon/fold/foldgutter.js"></script>
<script src="vendor/codemirror/addon/fold/brace-fold.js"></script>
<script src="vendor/codemirror/addon/search/searchcursor.js"></script>
<script src="vendor/codemirror/addon/search/search.js"></script>
<script src="vendor/codemirror/addon/dialog/dialog.js"></script>
<script src="vendor/codemirror/addon/search/jump-to-line.js"></script>
<script src="vendor/jshint/jshint.js"></script>
<script src="vendor/codemirror/addon/lint/lint.js"></script>
<script src="vendor/codemirror/addon/lint/javascript-lint.js"></script>
<script src="vendor/prettier/standalone.js"></script>
<script src="vendor/prettier/parser-babel.js"></script>
<script src="vendor/js-yaml/js-yaml.min.js"></script>
<script src="vendor/marked/marked.min.js"></script>
<script src="vendor/dompurify/purify.min.js"></script>
<script src="assets-manifest.js"></script>
<script src="js/starter-code.js"></script>
<script src="js/highlight.js"></script>
<script src="js/project.js"></script>
<script src="js/course.js"></script>
<script src="js/widgets.js"></script>
<script src="js/editor.js"></script>
<script src="js/game-runner.js"></script>
<script src="js/files.js"></script>
<script src="js/ai.js"></script>
<script src="js/console-dock.js"></script>
<script src="js/pages.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
