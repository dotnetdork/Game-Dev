     The shape is Unity's (docs/rework/v2-spec.md §3.3): a menu bar over a toolbar, then docks.
     Which dock sits where is not written here: editor.js moves the <section class="dock"> panels
     into the three areas (left, right, bottom) from the saved layout, so the order below is only

<div class="editor" id="editor">
  <!-- The menu bar: only items that work, and only for what the kid has met (editor.js, menus). -->
  <nav class="menubar" id="menubar" aria-label="Menus">
    <img class="wordmark" alt="The League of Amazing Programmers" src="/img/wordmark.png">
    <ul class="menus" role="menubar" id="menus" aria-label="Studio"></ul>
    <span class="project reveal closed" id="projName"><b id="projText">The intern’s game</b></span>
  </nav>

  <header class="toolbar" id="toolbar">
    <div class="tgroup reveal closed" id="editTools" role="group" aria-label="Undo and redo">
      <button type="button" class="tbtn quiet" id="bUndo" disabled data-tip="Undo: put back your last change (Ctrl+Z)"><svg class="i" aria-hidden="true"><use href="#i-undo"/></svg><span>Undo</span></button>
      <button type="button" class="tbtn quiet" id="bRedo" disabled data-tip="Redo: do it again (Ctrl+Y)"><svg class="i" aria-hidden="true"><use href="#i-redo"/></svg><span>Redo</span></button>
    </div>
    <div class="transport reveal closed" id="transport" role="group" aria-label="Play controls">
      <button type="button" class="tbtn" id="bPlay" aria-label="Play the game" data-tip="Play: run your game (Ctrl+P)"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span>Play</span></button>
      <span class="reveal closed stepper" id="stepTools">
        <button type="button" class="tbtn" id="bPause" disabled aria-pressed="false" data-tip="Pause: freeze the game where it is"><svg class="i" aria-hidden="true"><use href="#i-pause"/></svg><span>Pause</span></button>
        <button type="button" class="tbtn" id="bStep" disabled data-tip="Step: while paused, move the game one frame"><svg class="i" aria-hidden="true"><use href="#i-step"/></svg><span>Step</span></button>
      </span>
    </div>
    <div class="tool-right">
      <span class="menu-anchor reveal closed" id="layoutTools">
        <button type="button" class="tbtn quiet" id="bLayout" aria-haspopup="menu" aria-expanded="false" data-tip="Layout: put the panels back, or make the game big"><svg class="i" aria-hidden="true"><use href="#i-layout"/></svg><span>Layout</span></button>
      </span>
      <button type="button" class="tbtn quiet snd-toggle" id="bSound" aria-pressed="true" data-tip="Sound: the studio’s sounds and your game’s"><svg class="i" aria-hidden="true"><use href="#i-sound"/></svg><span>Sound on</span></button>
    </div>
  </header>

  <div class="area left" id="aLeft" data-area="left">
    <!-- Tickets: its own dock (Jay, 2026-09-28), above the Hierarchy, because a ticket is what the
         kid is working on and the Hierarchy is where they work on it. Rows are buttons (quest.js). -->
    <section class="dock closed" id="dTickets" data-panel="tickets" aria-label="Tickets">
      <div class="tabs"><span class="tab" data-drag><svg class="i" aria-hidden="true"><use href="#i-ticket"/></svg>Tickets <small id="ticketCount"></small></span></div>
      <div class="dock-body"><ul class="tickets" id="ticketList"></ul></div>
    </section>
    <section class="dock closed" id="dHier" data-panel="hierarchy" aria-label="Hierarchy">
      <div class="tabs"><span class="tab" data-drag><svg class="i" aria-hidden="true"><use href="#i-tree"/></svg>Hierarchy</span></div>
      <div class="dock-body"><ul class="tree" id="tree"></ul></div>
    </section>
  </div>

  <section class="dock game closed" id="dGame" data-panel="game" aria-label="Game">
    <div class="tabs"><span class="tab"><svg class="i" aria-hidden="true"><use href="#i-pad"/></svg>Game</span>
      <span class="paused-tag" id="pausedTag" hidden>Paused</span></div>
    <div class="gamebody" id="gamebody">
      <div class="stage" id="stage"></div>
      <div class="focus-hint" id="hint" hidden>Click the game, then <span class="keys"><span class="key">←</span><span class="key">→</span></span> or <span class="keys"><span class="key">A</span><span class="key">D</span></span> to move · <span class="key">Space</span> or <span class="key">W</span> to jump</div>
      <p class="game-status" id="gameStatus" role="status"></p>
    </div>
  </section>

  <div class="area right" id="aRight" data-area="right">
    <section class="dock inspector" id="inspector" data-panel="inspector" aria-label="Inspector" aria-hidden="true" inert>
      <div class="tabs"><span class="tab" data-drag><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg>Inspector <small id="inspName"></small></span>
        <button type="button" class="x" id="inspClose" aria-label="Close the Inspector" data-tip="Close the Inspector (Esc)"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
      <div class="dock-body" id="inspBody"></div>
    </section>
    <!-- Chat: one conversation, with whoever the story is with (chat.js); data-who on the dock
         colours its header. The task line says what this step wants, with a Hint when it has one. -->
    <section class="dock right" id="dMentor" data-panel="chat" data-who="m" aria-label="Chat">
      <div class="tabs"><span class="tab" data-drag><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>Chat</span></div>
      <div class="who">
        <div class="face" id="face" aria-hidden="true"><svg class="i"><use href="#i-bot"/></svg></div>
        <div><strong id="whoName">Mentor</strong><span id="whoRole">The studio’s AI</span></div>
      </div>
      <div class="task" id="task" hidden>
        <svg class="i" aria-hidden="true"><use href="#i-flag"/></svg>
        <p><small>Your task</small><span id="taskText"></span></p>
        <button type="button" class="tbtn quiet" id="taskHint" hidden data-tip="Stuck? Get a clue"><svg class="i" aria-hidden="true"><use href="#i-bulb"/></svg><span>Hint</span></button>
      </div>
      <div class="log" id="log" role="log" aria-label="Conversation"></div>
      <!-- the question card: one multiple-choice question at a time, above the text box (chat.js) -->
      <div class="qcard" id="qcard" role="group" aria-labelledby="qText" hidden></div>
      <form class="say" id="sayForm">
        <input id="say" type="text" autocomplete="off" maxlength="200" placeholder="Message the Mentor…" aria-label="Type a message to the Mentor">
        <button type="submit" class="send" id="sendBtn" aria-label="Send" data-tip="Send (Enter)"><svg class="i" aria-hidden="true"><use href="#i-send"/></svg></button>
      </form>
    </section>
  </div>

  <div class="area bottom" id="aBottom" data-area="bottom">
    <!-- The Project window, as Unity's: folders on the left, what's in the open one on the right.
         It holds everything the game is made of (Jay, 2026-09-28): sprites, sounds, the code, the
         docs, the cards. editor.js fills it from the project, so what's listed is what exists. -->
    <section class="dock closed" id="dProject" data-panel="project" aria-label="Project">
      <div class="tabs"><span class="tab" data-drag><svg class="i" aria-hidden="true"><use href="#i-folder"/></svg>Project</span></div>
      <div class="pwin">
        <div class="pnav" id="pFolders" role="tablist" aria-label="Folders" aria-orientation="vertical"></div>
        <div class="pbody" id="pBody" role="tabpanel">
          <p class="crumbs" id="pCrumbs"></p>
          <ul class="assets" id="assetGrid"></ul>
        </div>
      </div>
    </section>
    <!-- The Console: every event the game and the studio report, with its time. The chat shows the
         ones that matter as rows; this keeps them all (chat.js event()). -->
    <section class="dock closed" id="dConsole" data-panel="console" aria-label="Console">
      <div class="tabs"><span class="tab" data-drag><svg class="i" aria-hidden="true"><use href="#i-terminal"/></svg>Console <small id="consoleCount"></small></span></div>
      <div class="dock-body console"><ol class="clog" id="consoleList"></ol></div>
    </section>
  </div>

  <div class="pointer" id="pointer" hidden><span id="pointerText"></span></div>
  <p class="sr" id="announce" aria-live="polite"></p>
  <footer class="status">
    <span id="statusMsg">Welcome to the studio</span>
    <span class="stars reveal closed" id="stars"><svg class="i" aria-hidden="true"><use href="#i-star"/></svg><span id="starCount">0 stars</span></span>
  </footer>
</div>

<!-- Plain scripts sharing globals, in dependency order (CLAUDE.md: no bundler, no modules).
     ui.js       sounds, tooltips, focus keeping, feel. Needs nothing.
     project.js  the kid's game as data, and saving it. Needs nothing.
     schema.js   every component and setting a part can have: the one list the Inspector draws, the
                 characters may change, and the quests may name. Needs nothing.
     save.js     the server's copy of it. Needs Project.
     runner.js   the game frame and Play mode. Needs Project.
     builder.js  the Builder: the AI's changes to the game's code and parts. Needs Project, Runner;
                 calls Editor at run time only, so it may load before it.
     chat.js     the conversation and the Console. Needs Runner (it won't steal focus from a running game).
     editor.js   menus, docks, Hierarchy, Inspector, Project, Play, Undo. Needs UI, Project, Schema,
                 Runner, Chat, Save.
     quest.js    the quest engine and tickets. Needs all of the above.
     boot.js     loads the course and starts it. Last.
     dev.js      localhost only (the server refuses it on a deployment): the dev panel. -->
<script src="/studio/ui.js"></script>
<script src="/studio/project.js"></script>
<script src="/studio/schema.js"></script>
<script src="/studio/save.js"></script>
<script src="/studio/runner.js"></script>
<script src="/studio/builder.js"></script>
<script src="/studio/chat.js"></script>
<script src="/studio/editor.js"></script>
<script src="/studio/quest.js"></script>
<script src="/studio/boot.js"></script>
<script src="/studio/dev.js" onerror="this.remove()"></script>
</body>
</html>
