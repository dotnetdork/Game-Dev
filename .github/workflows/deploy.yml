name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The server enforces what this key can run (see /opt/gamedev/deploy.sh and the
      # command= restriction on this key in the league box's deploy user authorized_keys) —
      # whatever "script" says below is irrelevant to what actually executes remotely.
      - name: Deploy to league server
        uses: appleboy/ssh-action@v1
        with:
          host: apps.jointheleague.org
          username: deploy
          key: ${{ secrets.LEAGUE_GAMEDEV_DEPLOY_KEY }}
          script: deploy
