name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 20 is the floor `engines` allows and what app/Dockerfile runs on the League server; 24 is
      # the current LTS, so a Dockerfile bump is already known to work.
      # fail-fast off because "it breaks on 24 only" is the finding, and cancelling the other job
      # hides which half of that sentence is true.
      matrix:
        node: ['20', '24']
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        working-directory: app
        # `npm ci` only. It was `npm ci || npm install`, which turns the one thing ci is FOR —
        # failing when package-lock.json disagrees with package.json — into a silent fallback that
        # installs something else and carries on. A stale lockfile then reaches production without
        # anyone being told, which is the opposite of what the check was there to do.
        run: npm ci
      - name: Test
        working-directory: app
        # check-html       tag balance + the containment the three-column layout depends on
        # check-state      saved-state migrations, including the "never destroy a save" rule
        # subset-icons     every icon the app draws is in the subset (glyph half needs Python
        #                  + fontTools, which CI does not install — that half skips, loudly)
        # check-quiz       every malformed AI question is dropped rather than shown to a child
        # check-lessons    every authored quiz and your-turn step parses and is answerable
        # check-challenges every in-lesson lab is solvable AND not already solved, and fails
        #                  if it finds none at all
        # check-mcp        starts the MCP server and exercises its tools, resources and prompts
        # check-gamelog    what the game printed, as the AI receives it
        # check-boot       starts the real server and loads the real page
        #
        # Deliberately NOT here: tools/resize-brand-images.py (a one-off image-prep tool whose
        # output is committed — it needs numpy and Pillow, which is why every run of this
        # workflow failed before), and tools/check-release.js (asserts development switches are
        # off, which they are not while the app is being built — run it before a class).
        run: npm test
