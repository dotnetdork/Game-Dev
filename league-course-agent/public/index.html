<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEAGUE Game Dev</title>
<!-- League branding assets, self-hosted under public/img/. -->
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#102a49">
<!-- Libraries are vendored under public/vendor/ so the app keeps working on filtered
     school networks with no CDN access. See public/vendor/README.md to refresh them. -->
<link rel="stylesheet" href="vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="vendor/codemirror/theme/material-darker.css">
<link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.css">
<link rel="stylesheet" href="vendor/codemirror/addon/lint/lint.css">
<link rel="stylesheet" href="vendor/codemirror/addon/fold/foldgutter.css">
<link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.css">
<link rel="stylesheet" href="vendor/mdi/css/materialdesignicons.min.css">
<style>
  :root{--bg:#0a1728;--panel:#0f2440;--panel2:#13304f;--head:#102a49;--line:#223a58;
    --ink:#eaf1f8;--muted:#9fb2cc;--dim:#5f758f;--azure:#3e8fd6;--gold:#f5b02e;--teal:#2fd0b6;--green:#3ddc84;--sel:#1b4b78;
    --lock:#3a4a60;--brand:#f5820a;--brand-ink:#241300;--focus:#7cc4ff;--font:Segoe UI, Roboto, Arial, sans-serif;--leftw:280px;--rightw:320px;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;
    display:grid;grid-template-rows:46px 1fr 30px;height:100vh;overflow:hidden;}
  *::-webkit-scrollbar{width:10px;height:10px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:#26456b;border-radius:6px;border:2px solid var(--bg);}
  *::-webkit-scrollbar-thumb:hover{background:#33608f;}
  *{scrollbar-color:#26456b transparent;scrollbar-width:thin;}
  .mdi{line-height:1;}

  .topbar{background:var(--head);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap;}
  .brand .brand-logo{height:22px;width:auto;display:block;}
  .brand .brand-tag{color:var(--muted);font-weight:600;font-size:12px;border-left:1px solid var(--line);padding-left:10px;}
  .topnav{display:flex;gap:2px;}
  .navitem{display:flex;align-items:center;gap:6px;background:transparent;border:none;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;}
  .navitem .mdi{font-size:16px;}
  .navitem:hover{color:var(--ink);background:#173456;}
  .navitem.on{background:var(--azure);color:#06192e;}
  .topright{margin-left:auto;display:flex;align-items:center;gap:2px;}

  .stage-wrap{min-height:0;position:relative;overflow:hidden;}
  .editor{display:grid;grid-template-columns:var(--leftw) 1fr var(--rightw);height:100%;min-height:0;}
  .dock{position:relative;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;}
  .dock.right{border-right:none;border-left:1px solid var(--line);overflow:hidden;}
  .res{position:absolute;top:0;height:100%;width:6px;cursor:col-resize;z-index:5;}
  .res.r{right:-3px;} .res.l{left:-3px;}
  .res:hover{background:#2b4a6e;}
  .dock-head{padding:9px 12px;font-size:11px;letter-spacing:1.5px;font-weight:700;color:var(--dim);
    text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;justify-content:space-between;align-items:center;}
  .dock-head .tag{color:var(--teal);text-transform:none;font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;flex:none;}
  .dock-head .ai-title{display:flex;align-items:center;gap:8px;}
  .dock-head .ai-ava{width:20px;height:20px;border-radius:50%;object-fit:cover;background:var(--panel);}
  .dock-head{flex-wrap:nowrap;gap:6px;}
  .dock-head .ai-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:0;}
  .ai-toggle{display:inline-flex;align-items:center;justify-content:center;width:30px;height:24px;background:var(--panel);border:1px solid var(--line);border-radius:7px;cursor:pointer;color:var(--ink);text-transform:none;}
  .ai-toggle .mdi{font-size:16px;}
  .ai-toggle.tutor{color:var(--teal);border-color:var(--teal);}
  .ai-toggle.coder{color:var(--azure);border-color:var(--azure);}
  .msg.bot p{margin:0 0 8px;} .msg.bot p:last-child{margin-bottom:0;}
  .msg.bot ul,.msg.bot ol{margin:0 0 8px;padding-left:18px;}
  .msg.bot pre{background:#08121f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;font-family:Consolas,monospace;font-size:12px;color:#cfe0f2;margin:0 0 8px;}
  .msg.bot code{font-family:Consolas,monospace;font-size:12px;background:#0d2440;padding:1px 4px;border-radius:4px;}
  .msg.bot pre code{background:none;padding:0;}
  .mcq-opt.correct{border-color:var(--green);background:#0f2e22;}
  .mcq-opt.wrong{border-color:var(--gold);background:#2e2410;}
  .parsons-row{cursor:grab;user-select:none;}
  .parsons-row.dragging{opacity:.45;}
  .parsons-row.over{border-color:var(--azure);box-shadow:inset 0 0 0 1px var(--azure);}
  .parsons-row .drag-handle{color:var(--dim);display:flex;align-items:center;}
  .run-goal{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d2440;border-bottom:1px solid var(--line);font-size:13px;color:#c3d3e6;}
  .run-goal .mdi{color:var(--gold);}
  .run-sliders{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:#0d2440;}
  .run-slider{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#c3d3e6;}
  .run-slider .rs-name{min-width:130px;} .run-slider .rs-name b{color:var(--teal);}
  .run-slider input[type=range]{flex:1;}
  .run-status{font-size:12.5px;margin-left:8px;align-self:center;} .run-status.ok{color:var(--green);} .run-status.no{color:var(--gold);}
  .quiz-code{background:#08121f;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:Consolas,monospace;font-size:12.5px;color:#cfe0f2;white-space:pre-wrap;margin:0 0 4px;overflow-x:auto;}
  .parsons-row .p-use{margin:0 2px;}
  .parsons-row.unused{opacity:.5;} .parsons-row.unused code{text-decoration:line-through;}
  .parsons-hint{font-size:12px;color:var(--dim);margin-top:2px;}
  .fill-code{background:#08121f;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:Consolas,monospace;font-size:12.5px;color:#cfe0f2;white-space:pre-wrap;}
  .fill-input{background:#0d2440;border:1px solid var(--azure);border-radius:5px;color:var(--ink);font-family:Consolas,monospace;font-size:12.5px;padding:2px 6px;width:120px;}
  .findbug{display:flex;flex-direction:column;gap:2px;}
  .fb-row{display:flex;gap:10px;align-items:flex-start;padding:4px 8px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-family:Consolas,monospace;font-size:12.5px;color:#cfe0f2;background:#08121f;}
  .fb-row:hover{border-color:var(--line);}
  .fb-row .fb-num{color:var(--dim);min-width:16px;text-align:right;}
  .fb-row.sel{border-color:var(--azure);}
  .fb-row.correct{border-color:var(--green);background:#0f2e22;}
  .fb-row.wrong{border-color:var(--gold);background:#2e2410;}
  /* quiz display polish */
  .mcq-opt:has(input:checked){border-color:var(--azure);background:#12304f;}
  .mcq-opt input{accent-color:var(--azure);width:16px;height:16px;flex:none;}
  /* in-lesson challenge minigame */
  .challenge-mini{border:1px solid var(--brand);border-radius:14px;background:#1a130a;padding:18px 20px;margin-top:26px;}
  .cm-h{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--brand);font-weight:700;margin-bottom:10px;}
  .cm-task{color:#e6d6c2;font-size:14.5px;margin-bottom:12px;line-height:1.6;}
  .cm-code{width:100%;background:#08121f;border:1px solid var(--line);border-radius:8px;color:#cfe0f2;font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;padding:10px 12px;resize:vertical;display:block;}
  .cm-stage{width:100%;height:210px;border:0;border-radius:8px;margin-top:10px;background:#08121f;display:block;}
  .cm-bar{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .cm-run{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--font);}
  .cm-status{font-size:13px;} .cm-status.ok{color:var(--green);font-weight:700;} .cm-status.no{color:var(--gold);}
  .dock-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  #panel-outline{flex:1;min-height:0;overflow:auto;padding:4px 0;}
  #panel-info{flex:1;min-height:0;overflow:auto;}
  #panel-files{flex:1;min-height:0;display:flex;flex-direction:column;}

  .sec-head{display:flex;align-items:center;gap:7px;padding:7px 10px;cursor:pointer;font-weight:600;}
  .sec-head:hover{background:#122c4c;}
  .sec-head.locked{color:var(--lock);cursor:not-allowed;}
  .sec-head .mdi{font-size:17px;color:var(--gold);}
  .sec-head.locked .mdi{color:var(--lock);}
  .tri{width:12px;color:var(--muted);font-size:11px;}
  .kids .page{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 28px;cursor:pointer;color:var(--muted);}
  .kids .page .mdi{font-size:16px;color:var(--teal);}
  .kids .page:hover{background:#122c4c;color:var(--ink);}
  .kids .page.active{background:var(--sel);color:#fff;}
  .kids .page.done .mdi{color:var(--gold);}
  .kids .page.locked{color:var(--lock);cursor:not-allowed;}
  .kids .page.locked .mdi{color:var(--lock);}
  .sec.collapsed .kids{display:none;}
  .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  #fileList{flex:1;min-height:0;overflow:auto;padding:6px 0;}
  .filerow{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 12px;cursor:pointer;color:var(--muted);font-family:Consolas,monospace;font-size:12.5px;}
  .filerow .mdi{font-size:15px;color:var(--teal);}
  .filerow:hover{background:#122c4c;color:var(--ink);}
  .filerow.active{background:var(--sel);color:#fff;}
  .filerow .del{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;opacity:0;display:flex;padding:2px;border-radius:5px;}
  .filerow .del .mdi{font-size:15px;color:inherit;}
  .filerow:hover .del{opacity:1;}
  .filerow .del:hover{color:#ff9b9b;background:#2a1420;}
  .filerow .del.rst:hover{color:var(--teal);background:#0d2e2a;}
  .fileactions{flex:none;border-top:1px solid var(--line);display:flex;gap:6px;padding:8px 10px;background:var(--panel2);}
  .iconbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:8px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:600;}
  .iconbtn .mdi{font-size:16px;}
  .iconbtn.run{background:var(--gold);color:#2a1c00;border:none;}
  .iconbtn:hover{filter:brightness(1.12);}

  .info-hd{padding:10px 12px 4px;color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase;}
  .setrow{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #16304e;color:var(--muted);font-size:13px;}
  .setrow b{color:var(--ink);font-family:Consolas,monospace;}

  .center{display:flex;flex-direction:column;min-width:0;background:var(--bg);}
  .viewbar{display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:38px;border-bottom:1px solid var(--line);background:var(--panel);}
  .crumb{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vtabs{display:flex;gap:4px;flex:none;}
  .vtab{display:flex;align-items:center;gap:6px;padding:5px 13px;border:none;border-radius:6px;background:transparent;color:var(--muted);font-weight:600;font-family:var(--font);font-size:13px;cursor:pointer;}
  .vtab .mdi{font-size:15px;}
  .vtab.on{background:var(--azure);color:#06192e;}
  .viewbody{flex:1;min-height:0;position:relative;}
  .view{position:absolute;inset:0;display:flex;flex-direction:column;}
  [hidden]{display:none !important;}

  /* learn = scrollable article */
  #view-learn{background:var(--bg);overflow:auto;display:block;}
  .lesson{max-width:none;margin:0;padding:0 0 50px;background:transparent;border:0;box-shadow:none;border-radius:0;}
  .lesson-hero{padding:28px 0 22px;background:linear-gradient(135deg,var(--mod,#143561),#0d2440);border-bottom:1px solid var(--line);}
  .hero-inner{max-width:820px;margin:0 auto;padding:0 40px;}
  .lesson-content{max-width:820px;margin:0 auto;padding:28px 40px 0;font-size:16.5px;line-height:1.75;}
  .lesson h1{font-size:32px;margin:0;letter-spacing:-.3px;}
  .lesson .lead{color:#b7c8dc;font-size:16px;line-height:1.6;margin:10px 0 0;}
  .lesson-meta{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .lesson-meta .lchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#cfe0f2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;}
  .lesson-meta .lchip .mdi{font-size:14px;color:var(--gold);}
  .lesson h2{font-size:18px;margin:26px 0 8px;color:var(--ink);padding-left:12px;border-left:3px solid var(--teal);border-radius:0;}
  .lesson p{color:#c3d3e6;line-height:1.7;margin:0 0 14px;}
  .lesson ul{color:#c3d3e6;line-height:1.7;margin:0 0 14px;padding-left:22px;}
  .lesson pre{background:#08121f;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;color:#cfe0f2;font-family:Consolas,monospace;font-size:12.5px;}
  .lesson .tip{display:flex;gap:10px;background:#0d2038;border-radius:10px;padding:14px 16px;color:var(--muted);margin:0 0 14px;}
  .lesson .tip .mdi{color:var(--gold);font-size:20px;}
  .challenge{border:1px solid var(--line);border-radius:12px;padding:20px 22px;background:#0d2038;margin-top:26px;}
  .challenge .ch-h{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px;}
  .btn-primary{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:var(--brand-ink);border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-family:var(--font);font-size:14px;margin-top:10px;}
  .btn-primary:disabled{background:#2f7a5e;color:#bfeede;cursor:default;}

  #view-code{background:#08121f;}
  #codeeditor{display:none;}
  .cm-statusbar{position:absolute;right:0;bottom:0;z-index:5;background:rgba(8,18,31,.86);border:1px solid var(--line);border-right:0;border-bottom:0;border-top-left-radius:6px;color:var(--dim);font-family:Consolas,monospace;font-size:11px;padding:2px 9px;pointer-events:none;}
  .CodeMirror-hints{z-index:1000;font-family:Consolas,monospace;font-size:12.5px;}
  .CodeMirror-lint-tooltip{z-index:1000;font-family:var(--font);font-size:12px;}
  .cm-s-material-darker .CodeMirror-foldmarker{color:var(--brand);text-shadow:none;}
  .folderhead{display:flex;align-items:center;gap:7px;padding:9px 10px 4px 12px;color:var(--dim);font-family:Consolas,monospace;font-size:11px;text-transform:uppercase;letter-spacing:.5px;user-select:none;border-top:1px solid var(--line);margin-top:4px;cursor:pointer;}
  .folderhead .mdi{font-size:14px;color:var(--gold);}
  .folderhead .fcount{margin-left:4px;color:var(--dim);}
  .assetrow{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 28px;cursor:pointer;color:var(--muted);font-family:Consolas,monospace;font-size:12px;}
  .assetrow:hover{background:#122c4c;color:var(--ink);}
  .assetrow img{width:18px;height:18px;object-fit:contain;flex:none;}
  .assetrow .mdi{font-size:15px;color:var(--teal);flex:none;}
  .assetrow .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .assetrow .akey{margin-left:auto;color:var(--dim);font-size:10.5px;flex:none;}
  .folderhead:hover{color:var(--muted);}
  .folderhead .caret{color:var(--dim);font-size:16px;margin-left:-2px;}
  #fileList .filerow{padding-left:28px;}
  .assetrow.empty{color:var(--dim);cursor:default;font-style:italic;}
  .asset-preview{display:flex;align-items:center;justify-content:center;background:#0c1b2e;border:1px solid var(--line);border-radius:10px;padding:16px;margin:2px 0 14px;min-height:130px;}
  .asset-preview img{max-width:72%;max-height:150px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
  .asset-info .ai-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);}
  .asset-info .ai-row span{color:var(--muted);}
  .asset-info code{background:#0c1b2e;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:#cfe6ff;font-size:12px;font-family:Consolas,monospace;}
  .asset-info .ai-desc{margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.5;}
  .game-audio{margin-left:auto;display:flex;align-items:center;gap:7px;}
  .game-audio button{background:none;border:0;color:var(--muted);cursor:pointer;display:flex;align-items:center;padding:0;}
  .game-audio button .mdi{font-size:16px;}
  .game-audio button.on{color:var(--brand);}
  .game-audio button:hover{color:var(--ink);}
  .game-audio input[type=range]{width:74px;accent-color:var(--brand);cursor:pointer;height:14px;}
  .game-audio input[type=range]:disabled{opacity:.4;cursor:default;}
  .CodeMirror{flex:1;height:100%;font-family:Consolas,"Courier New",monospace;font-size:12.5px;}
  #view-play{background:radial-gradient(120% 120% at 50% 0%,#0c1c31,#06101c);padding:16px;}
  .stage{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:0;}
  .stage-frame{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#06101c;box-shadow:0 18px 55px rgba(0,0,0,.55);}
  #gameFrame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#06101c;}
  .game-loading{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;gap:10px;background:#06101c;color:var(--muted);font-size:14px;font-weight:600;}
  .game-loading.hidden{display:none;}
  .game-loading .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .game-loading .spin{animation:none;} }
  .console{flex:none;display:flex;flex-direction:column;border-top:1px solid var(--line);background:#0a1524;height:34%;}
  .console.collapsed{height:auto;}
  .console.collapsed .console-body{display:none;}
  .console-head{flex:none;display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted);}
  .console-head .con-title{display:flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .console-head .con-title .mdi{color:var(--azure);}
  .con-toggle{background:none;border:0;color:var(--muted);cursor:pointer;display:flex;padding:0;}
  .con-toggle .mdi{font-size:18px;transition:transform .15s;}
  .console.collapsed .con-toggle .mdi{transform:rotate(-90deg);}
  .con-clear{margin-left:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:2px 8px;font-size:11px;cursor:pointer;}
  .console-body{flex:1;min-height:0;overflow:auto;padding:6px 10px;font-family:Consolas,monospace;font-size:12px;line-height:1.5;color:#cfe0f2;}
  .console-body .cl{white-space:pre-wrap;} .console-body .cl.err{color:#ff9b9b;} .console-body .cl.warn{color:var(--gold);}
  .console-body .cl-empty{color:var(--dim);}

  .ai{display:flex;flex-direction:column;flex:1;min-height:0;}
  .ai-msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:88%;padding:9px 12px;border-radius:12px;line-height:1.45;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;}
  .msg.bot{align-self:flex-start;background:var(--panel2);color:var(--ink);border-top-left-radius:3px;}
  .msg.user{align-self:flex-end;background:var(--azure);color:#06192e;font-weight:600;border-top-right-radius:3px;}
  .ai-input{flex:none;display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);background:var(--panel2);}
  .ai-input input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:8px 10px;font-family:var(--font);font-size:13px;outline:none;}
  .ai-input input:focus{border-color:var(--azure);}
  .ai-input button{flex:none;background:var(--gold);color:#2a1c00;border:none;border-radius:7px;padding:8px 12px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;}

  /* generic pages */
  .page{height:100%;overflow:auto;padding:34px 44px;}
  .page .phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .page h2{font-size:28px;margin:0 0 4px;display:flex;align-items:center;gap:10px;}
  .page h2 .mdi{color:var(--azure);}
  .page .sub{color:var(--muted);margin:0;font-size:14px;}

  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
  .gcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .gcard .art{height:130px;display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;position:relative;}
  .gcard .art .mdi{font-size:52px;opacity:.92;}
  .gcard .body{padding:14px 16px;display:flex;flex-direction:column;flex:1;}
  .gcard h3{margin:0 0 4px;font-size:16px;}
  .gcard .tags{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap;}
  .chip{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);background:#12304f;border-radius:999px;padding:3px 8px;}
  .gcard p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.45;flex:1;}
  .gcard .cta{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .star-balance{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--gold);font-size:16px;}
  .star-balance .mdi{font-size:19px;}
  .gbtn{display:flex;align-items:center;gap:5px;background:var(--azure);color:#06192e;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:var(--font);font-size:12.5px;}
  .gbtn.locked{background:#2b3d57;color:var(--muted);cursor:not-allowed;}
  .gbtn.owned-btn{background:var(--teal);}
  .gcard .art img{max-width:80%;max-height:98px;filter:drop-shadow(0 4px 9px rgba(0,0,0,.45));}
  .gcard .art.pixel img{image-rendering:pixelated;}
  .gcard .art .playbtn{position:absolute;bottom:9px;right:9px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(6,16,28,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;transition:background .12s,transform .06s;}
  .gcard .art .playbtn:hover{background:rgba(6,16,28,.82);}
  .gcard .art .playbtn:active{transform:scale(.92);}
  .chip.key{background:#0d2a12;color:#8fe0a0;text-transform:none;letter-spacing:0;font-family:ui-monospace,Menlo,Consolas,monospace;}
  .gcard p.use{margin:0 0 14px;font-size:12px;color:var(--muted);flex:1;}
  .gcard p.use code{background:#0c1b2e;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:#cfe6ff;font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;}
  .store-filter{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 20px;}
  .store-filter button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 15px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:var(--font);transition:background .12s,color .12s,border-color .12s;}
  .store-filter button:hover{border-color:#3a6da3;color:#cfe6ff;}
  .store-filter button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}

  /* showcase */
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .scard .art{height:150px;position:relative;display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff;}
  .scard .art .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,16,28,.35);opacity:0;transition:opacity .15s;}
  .scard:hover .art .play{opacity:1;}
  .scard .art .play .mdi{font-size:46px;color:#fff;}
  .scard .body{padding:12px 14px;display:flex;align-items:center;gap:10px;}
  .avatar{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#06192e;font-size:14px;}
  .scard .meta{min-width:0;flex:1;} .scard .meta h3{margin:0;font-size:15px;} .scard .meta .by{color:var(--muted);font-size:12px;}
  .scard .stat{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:4px;}
  /* ---- component polish ---- */
  .gcard,.scard{box-shadow:0 2px 12px rgba(0,0,0,.28);transition:transform .14s ease,border-color .14s,box-shadow .14s;}
  .gcard:hover,.scard:hover{transform:translateY(-4px);border-color:#3a6da3;box-shadow:0 14px 32px rgba(0,0,0,.42);}

  .gcard .art .mdi,.scard .art .mdi{filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}
  .gbtn{box-shadow:0 1px 2px rgba(0,0,0,.25);transition:filter .12s,transform .05s,box-shadow .12s;}
  .gbtn:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 3px 10px rgba(0,0,0,.35);}
  .gbtn:active:not(:disabled){transform:translateY(1px);}
  .btn-primary{box-shadow:0 2px 12px rgba(245,130,10,.35);transition:filter .12s,transform .05s;}
  .btn-primary:hover:not(:disabled){filter:brightness(1.06);}
  .btn-primary:active:not(:disabled){transform:translateY(1px);}
  .cost{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--gold);font-size:14px;}
  .cost .mdi{font-size:16px;}
  .owned{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-weight:600;font-size:13px;}
  .kids .page{border-left:3px solid transparent;transition:background .1s,color .1s,border-color .1s;}
  .kids .page.active{border-left-color:var(--azure);}
  .kids .page.done .lbl{color:var(--muted);}
  .sec-head{border-radius:8px;transition:background .1s;}

  /* leaderboard */
  .board{max-width:1080px;margin:0 auto;}
  .board-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{background:none;border:0;color:var(--muted);padding:9px 16px;font-weight:700;cursor:pointer;font-size:12.5px;font-family:var(--font);transition:background .12s,color .12s;}
  .seg button:hover{color:var(--ink);}
  .seg button.on{background:var(--azure);color:#06192e;}
  .seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;}
  .your-rank{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:#241a12;border:1px solid var(--brand);border-radius:999px;padding:8px 15px;color:var(--ink);font-weight:600;font-size:13px;}
  .your-rank .r{color:var(--brand);font-weight:800;}
  /* podium */
  .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:14px;margin-bottom:22px;}
  .pod{position:relative;background:linear-gradient(180deg,var(--panel),#0c2038);border:1px solid var(--line);border-radius:16px;padding:22px 12px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 10px 26px rgba(0,0,0,.34);}
  .pod .medal{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#06192e;box-shadow:0 3px 8px rgba(0,0,0,.4);}
  .pod .medal .mdi{font-size:20px;}
  .pod .pod-av{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#06192e;font-size:22px;border:2px solid rgba(255,255,255,.18);}
  .pod .pod-nm{font-weight:800;font-size:14.5px;}
  .pod .pod-lv{color:var(--muted);font-size:11.5px;margin-top:-3px;}
  .pod .pod-xp{color:var(--teal);font-weight:800;font-size:14px;}
  .pod.p1{padding-top:32px;border-color:var(--brand);background:linear-gradient(180deg,#25190e,#0c2038);}
  .pod.p1 .pod-av{width:70px;height:70px;font-size:26px;border-color:var(--brand);}
  .pod.p1 .pod-xp{color:var(--brand);}
  .pod.you{outline:2px solid var(--brand);outline-offset:2px;}
  .pod.g .medal{background:#ffcf4d;} .pod.s .medal{background:#cfd8e3;} .pod.b .medal{background:#e0965a;}
  /* two-column body */
  .lb-body{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start;}
  .lb-list{display:flex;flex-direction:column;gap:9px;min-width:0;}
  .board .empty{color:var(--muted);padding:26px;background:var(--panel);border:1px solid var(--line);border-radius:14px;}
  .lrow{display:flex;align-items:center;gap:14px;background:#122c49;border:1px solid var(--line);border-radius:12px;padding:15px 18px;transition:transform .1s,border-color .12s,box-shadow .12s;}
  .lrow:hover{transform:translateY(-2px);border-color:#3a6da3;box-shadow:0 8px 20px rgba(0,0,0,.3);}
  .lrow.you{border-color:var(--brand);background:#2a1c10;}
  .lrow .rank{width:30px;font-weight:800;font-size:16px;color:var(--muted);text-align:center;flex:none;}
  .lrow .rank.g{color:#ffcf4d;} .lrow .rank.s{color:#cfd8e3;} .lrow .rank.b{color:#e0965a;}
  .lrow .avatar{width:40px;height:40px;font-size:16px;}
  .lrow .who{flex:1;min-width:0;} .lrow .who .nm{font-weight:700;font-size:14.5px;} .lrow .who .lv{color:var(--muted);font-size:12px;}
  .lrow .xp{color:var(--teal);font-weight:800;font-size:14.5px;white-space:nowrap;} .lrow.you .xp{color:var(--brand);}
  .lbar{height:8px;background:#0d2036;border-radius:4px;margin-top:7px;overflow:hidden;}
  .lbar > div{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:4px;}
  /* right rail */
  .rail{display:flex;flex-direction:column;gap:16px;}
  .rail .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;}
  .rail .yourcard{border-color:var(--brand);background:linear-gradient(180deg,#25190e,var(--panel));}
  .rail .yc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .rail .yc-h .lbl{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .rail .yc-xp{font-weight:800;color:var(--ink);font-size:15px;}
  .rail .yc-rank{font-size:34px;font-weight:900;color:var(--brand);line-height:1;}
  .rail .yc-sub{color:var(--muted);font-size:12.5px;margin-top:6px;}
  .rail .prog{height:10px;background:#0d2036;border-radius:5px;overflow:hidden;margin:12px 0 6px;}
  .rail .prog > div{height:100%;background:linear-gradient(90deg,var(--brand),#ffb347);border-radius:5px;}
  .rail .prog-cap{color:var(--muted);font-size:12px;}
  .rail .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .rail .stat{background:#0f2440;border:1px solid var(--line);border-radius:11px;padding:12px;}
  .rail .stat .v{font-weight:800;font-size:18px;color:var(--ink);} .rail .stat .v.gold{color:var(--gold);} .rail .stat .v.teal{color:var(--teal);}
  .rail .stat .k{color:var(--muted);font-size:11px;margin-top:2px;}
  .rail .startbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--brand);color:var(--brand-ink);border:none;border-radius:9px;padding:11px;font-weight:800;cursor:pointer;font-family:var(--font);font-size:13.5px;margin-top:12px;}
  .rail .startbtn:hover{filter:brightness(1.07);}
  @media(max-width:900px){.lb-body{grid-template-columns:1fr;}.rail{flex-direction:row;flex-wrap:wrap;}.rail .card{flex:1;min-width:240px;}.podium{grid-template-columns:1fr;}.pod.p1{order:-1;}}

  .doclink{color:var(--azure);font-weight:600;text-decoration:none;}
  .help-body{max-width:780px;line-height:1.7;}
  .help-body h3{margin:22px 0 6px;color:var(--teal);font-size:16px;display:flex;align-items:center;gap:8px;}
  .help-body p,.help-body li{color:var(--muted);}

  /* footer */
  .statusbar{background:var(--head);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px;color:var(--dim);font-size:12px;}
  .sb-left{flex:1;white-space:nowrap;}
  .sb-right{flex:1;text-align:right;white-space:nowrap;}
  .sb-mid{flex:none;display:flex;align-items:center;gap:12px;white-space:nowrap;}
  .sb-mid .mdi{font-size:14px;vertical-align:-1px;}
  .sb-mid .st{color:var(--gold);} .sb-mid .xp{color:var(--teal);} .sb-mid b{color:var(--ink);}
  .sb-mid .xp-bolt{height:13px;width:auto;vertical-align:-2px;}
  .progress{width:200px;height:7px;background:#0d2440;border:1px solid var(--line);border-radius:5px;overflow:hidden;}
  .progress > div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .4s ease;}
  .doc-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .doc-card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;}
  .doc-card h3 .mdi{color:var(--azure);}
  .doc-card pre{margin:0;background:#08121f;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:#cfe0f2;font-family:Consolas,monospace;font-size:12px;overflow:auto;}
  .wiki{display:flex;gap:26px;align-items:flex-start;}
  .wiki-toc{position:sticky;top:0;flex:none;width:200px;display:flex;flex-direction:column;gap:1px;}
  .wiki-toc a{display:flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer;}
  .wiki-toc a:hover{background:#122c4c;color:var(--ink);}
  .wiki-toc a .mdi{font-size:15px;color:var(--azure);}
  .wiki-main{flex:1;min-width:0;max-width:820px;}
  .wiki-sec{margin:0 0 30px;scroll-margin-top:14px;}
  .wiki-sec h3{font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
  .wiki-sec h3 .mdi{color:var(--teal);}
  .wiki-sec p{color:#c3d3e6;line-height:1.7;margin:0 0 12px;}
  .wiki-sec pre{background:#08121f;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;color:#cfe0f2;font-family:Consolas,monospace;font-size:12.5px;line-height:1.55;margin:0;}
  .lesson img{max-width:100%;border-radius:10px;}
  .lesson blockquote{margin:14px 0;padding:10px 14px;border-left:3px solid var(--teal);background:#0d2440;border-radius:0 8px 8px 0;color:#c3d3e6;}
  .lesson blockquote p{margin:0;}
  .runcell{margin:14px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0d2440;}

  .runcell .runbar{display:flex;justify-content:flex-end;padding:6px 8px;background:var(--panel2);}
  .runcell .runbtn{background:var(--teal);color:#04231d;border:0;border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .runcell iframe.runout{width:100%;height:120px;border:0;border-top:1px solid var(--line);display:none;background:#08121f;}
  .quizcell{margin:16px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;}
  .quiz-h{font-weight:600;display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:10px;}
  .quiz-h .mdi{font-size:18px;color:var(--azure);}
  .quiz-body{display:flex;flex-direction:column;gap:8px;}
  .mcq-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#0d2440;transition:border-color .1s,background .1s;}
  .mcq-opt:hover{border-color:var(--azure);}
  .parsons{display:flex;flex-direction:column;gap:6px;}

  .parsons-row code{color:#cfe0f2;font-family:Consolas,monospace;font-size:12.5px;}
  .quiz-check{align-self:flex-start;margin-top:6px;background:var(--azure);color:#04223c;border:0;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 10px rgba(245,130,10,.28);}
  .quiz-result{margin-top:10px;font-size:13px;font-weight:600;min-height:1em;}
  .quiz-result.ok{color:var(--green);} .quiz-result.no{color:var(--gold);}

  .toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(20px);background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:12px 18px;font-size:13.5px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:80%;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(4,10,20,.6);display:flex;align-items:center;justify-content:center;z-index:200;}

  .modal p{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.5;}

  .ai-collapse .mdi{font-size:18px;}

  .mcq-opt.correct::after{content:"\2713";margin-left:auto;color:var(--green);font-weight:700;font-size:15px;}
  .mcq-opt.wrong::after{content:"\2717";margin-left:auto;color:var(--gold);font-weight:700;font-size:15px;}
  .fb-row.correct::after{content:"\2713";margin-left:auto;color:var(--green);font-weight:700;}
  .fb-row.wrong::after{content:"\2717";margin-left:auto;color:var(--gold);font-weight:700;}
  .quiz-result.ok::before{content:"\2713 ";} .quiz-result.no::before{content:"\2717 ";}
</style>

    </div>
    <div class="topright">
      <button class="navitem" data-page="docs"><span class="mdi mdi-book-open-variant"></span>Docs</button>
      <button class="navitem" data-page="help"><span class="mdi mdi-help-circle-outline"></span>Help</button>
    </div>
  </div>

  <div class="stage-wrap">
    <button id="aiFab" class="ai-fab" title="Open the assistant" hidden><span class="mdi mdi-robot-happy-outline"></span></button>
    <div class="editor" id="editor">
      <div class="dock left">
        <div class="res r" id="resLeft"></div>
        <div class="dock-head" id="leftTitle">Course Outline</div>
        <div class="dock-body">
          <div id="panel-outline"><div id="tree"></div></div>
          <div id="panel-files" hidden>
            <div id="fileList"></div>
            <div class="fileactions">
              <button class="iconbtn" id="newFileBtn" title="New script"><span class="mdi mdi-file-plus-outline"></span>New</button>
              <button class="iconbtn" id="saveBtn" title="Save"><span class="mdi mdi-content-save-outline"></span>Save</button>
              <button class="iconbtn" id="runBtn" title="Save & run"><span class="mdi mdi-play"></span>Run</button>
            </div>
          </div>
          <div id="panel-info" hidden>
            <div class="info-hd">Current settings</div>
            <div id="infoSettings"></div>
            <button class="iconbtn" id="resetGameBtn" title="Restore the original starter game" style="margin:14px 12px;"><span class="mdi mdi-restore"></span>Reset game</button>
          </div>
        </div>
      </div>

      <div class="center">
        <div class="viewbar">
          <span class="crumb" id="crumb">Welcome</span>
          <div class="vtabs">
            <button class="vtab on" data-view="learn"><span class="mdi mdi-book-open-page-variant"></span>Learn</button>
            <button class="vtab" data-view="code"><span class="mdi mdi-code-tags"></span>Code</button>
            <button class="vtab" data-view="play"><span class="mdi mdi-gamepad-variant"></span>Play</button>
          </div>
        </div>
        <div class="viewbody">
          <div class="view" id="view-learn"><div class="lesson" id="lessonBody"></div></div>
          <div class="view" id="view-code" hidden><textarea id="codeeditor"></textarea><div class="cm-statusbar" id="cmStatus">Ln 1, Col 1</div></div>
          <div class="view" id="view-play" hidden>
            <div class="stage" id="gameStage">
              <div class="stage-frame">
                <iframe id="gameFrame" title="Game viewport"></iframe>
                <div class="game-loading hidden" id="gameLoading"><span class="spin"></span>Building your game…</div>
              </div>
            </div>
          </div>
        </div>
        <div class="console" id="console" hidden>
          <div class="console-head">
            <button class="con-toggle" id="conToggle" title="Show or hide the log"><span class="mdi mdi-chevron-down"></span></button>
            <span class="con-title"><span class="mdi mdi-console-line"></span>Console</span>
            <div class="game-audio" id="gameAudio" title="Game sound"><button id="muteBtn" title="Sound is off — click to turn it on"><span class="mdi mdi-volume-off"></span></button><input type="range" id="volSlider" min="0" max="100" value="50" disabled></div>
            <button class="con-clear" id="conClear" title="Clear the log">Clear</button>
          </div>
          <div class="console-body" id="consoleBody"></div>
        </div>
      </div>

      <div class="dock right">
        <div class="res l" id="resRight"></div>
        <div class="dock-head">
          <span class="ai-title"><img class="ai-ava" src="img/clearRobotRing4.png" alt="">AI Assistant</span>
          <button class="ai-toggle coder" id="modeToggle" title="Build mode — click to switch to Tutor"><span class="mdi mdi-code-tags"></span></button>
          <span class="tag" id="aiModelTag">model…</span>
          <button class="ai-collapse" id="aiCollapse" title="Hide the assistant"><span class="mdi mdi-chevron-right"></span></button>
        </div>
        <div class="ai">
          <div class="ai-msgs" id="aiMsgs"></div>
          <div class="ai-input">
            <input id="aiText" placeholder="Ask the AI to change your game...">
            <button id="aiSend" title="Send"><span class="mdi mdi-send"></span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="page" id="page" hidden></div>
  </div>

  <div class="statusbar">
    <span class="sb-left">Game Development Course — v0.0.0</span>
    <div class="sb-mid">
      <span><span class="mdi mdi-star st"></span> <b id="starVal">0</b></span>
      <div class="progress" title="XP to next level"><div id="xpBar"></div></div>
      <span class="xp"><img class="xp-bolt" src="img/bolt.png" alt="XP"> <b id="xpVal">0</b> XP</span>
      <span>Lvl <b id="lvlVal">1</b></span>
    </div>
    <span class="sb-right">© The League of Amazing Programmers</span>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modalBack" hidden></div>

<script src="vendor/codemirror/addon/hint/anyword-hint.js"></script>
<script src="vendor/codemirror/addon/hint/javascript-hint.js"></script>
<script src="vendor/codemirror/addon/fold/foldcode.js"></script>
<script src="vendor/codemirror/addon/fold/foldgutter.js"></script>
<script src="vendor/codemirror/addon/fold/brace-fold.js"></script>
<script src="vendor/codemirror/addon/search/searchcursor.js"></script>
<script src="vendor/codemirror/addon/search/search.js"></script>
<script src="vendor/codemirror/addon/dialog/dialog.js"></script>
<script src="vendor/codemirror/addon/search/jump-to-line.js"></script>
<script src="vendor/jshint/jshint.js"></script>
<script src="vendor/codemirror/addon/lint/lint.js"></script>
<script src="vendor/codemirror/addon/lint/javascript-lint.js"></script>
<script src="vendor/prettier/standalone.js"></script>
<script src="vendor/prettier/parser-babel.js"></script>
<script src="vendor/js-yaml/js-yaml.min.js"></script>
<script src="vendor/marked/marked.min.js"></script>
<script src="vendor/dompurify/purify.min.js"></script>
<script src="assets-manifest.js"></script>
<script src="app.js"></script>
</body>
