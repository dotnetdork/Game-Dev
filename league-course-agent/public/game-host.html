<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#06101c;overflow:hidden;}#game{width:100%;height:100vh;}</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
  // Load every script in the workspace, in a safe order:
  // game.js first (defines things) -> any student scripts -> main.js last (boots the game).
  var t = Date.now();
  fetch('/api/files').then(function (r) { return r.json(); }).then(function (files) {
    var others = files.filter(function (f) { return f !== 'game.js' && f !== 'main.js'; }).sort();
    var ordered = [];
    if (files.indexOf('game.js') >= 0) ordered.push('game.js');
    ordered = ordered.concat(others);
    if (files.indexOf('main.js') >= 0) ordered.push('main.js');
    var i = 0;
    (function next() {
      if (i >= ordered.length) return;
      var s = document.createElement('script');
      s.src = '/workspace/' + ordered[i] + '?t=' + t;
      s.onload = s.onerror = function () { i++; next(); };
      document.body.appendChild(s);
    })();
  });
</script>
</body>
</html>
